[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlpinsight-analyzer"
version = "1.0.0"
description = "Sentiment analysis with fine-tuned DistilBERT transformers"
readme = "README.md"
requires-python = ">=3.13"
license = {file = "LICENSE"}
authors = [
    {name = "Duque Ortega Mutis (DuqueOM)", email = "DuqueOrtegaMutis@gmail.com"}
]
keywords = ["nlp", "sentiment-analysis", "transformers", "deep-learning", "mlops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# What the image installs and the service imports (ADR-019) — the only
# declaration; the hand-kept requirements.txt the Dockerfile read is gone.
# torch comes from the PyTorch CPU index (root [tool.uv.sources]), as the
# Dockerfile installed it before. scikit-learn ~= 1.7.2 matches
# models/model.joblib; fastapi/uvicorn/pydantic/joblib now share BankChurn's
# versions — one version per package across the monorepo (ADR-019).
dependencies = [
    "torch ~= 2.14.1",
    "transformers ~= 4.48.0",
    "sentencepiece ~= 0.2.0",
    "protobuf ~= 5.29.0",
    "scikit-learn ~= 1.7.2",
    "joblib ~= 1.6.0",
    "pandas ~= 2.3.0",
    "numpy>=2.4.6,<2.6.0",
    "fastapi ~= 0.162.0",
    "uvicorn ~= 0.53.0",
    "pydantic ~= 2.14.1",
    "python-multipart ~= 0.0.32",
    "pyyaml ~= 6.0.0",
    "prometheus-client ~= 0.26.0",
]

[dependency-groups]
train = [
    "mlflow ~= 3.16.1",
    "datasets ~= 5.0.1",
    "evidently ~= 0.7.23",
]

[tool.uv]
# Virtual member: run from source, never built (ADR-019).
package = false

[project.urls]
Homepage = "https://github.com/DuqueOM/ML-MLOps-Portfolio"
Repository = "https://github.com/DuqueOM/ML-MLOps-Portfolio"
Documentation = "https://github.com/DuqueOM/ML-MLOps-Portfolio/tree/main/NLPInsight-Analyzer"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 120
target-version = ['py313']

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=60",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gpu: marks tests requiring GPU",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/nlpinsight"]
omit = [
    "tests/*",
    "test_*.py",
    ".venv/*",
    "venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
