# NLPInsight Analyzer Configuration

data:
  train_path: "data/raw/train.csv"
  test_path: "data/raw/test.csv"
  text_column: "text"
  label_column: "label"
  max_length: 256
  labels: ["negative", "neutral", "positive"]

model:
  pretrained_name: "distilbert-base-uncased"
  num_labels: 3
  learning_rate: 2.0e-5
  weight_decay: 0.01
  epochs: 3
  batch_size: 16
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  fp16: false
  seed: 42
  early_stopping_patience: 2

paths:
  model_dir: "models"
  artifacts_dir: "artifacts"
  metrics_path: "artifacts/metrics.json"
  model_export_path: "models/model.joblib"

mlflow:
  enabled: false
  tracking_uri: "file:./mlruns"
  experiment_name: "nlpinsight"
