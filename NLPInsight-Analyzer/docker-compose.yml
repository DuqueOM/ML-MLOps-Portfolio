version: '3.9'
services:
  api:
    build:
      # Repository root: the image installs from the workspace uv.lock (ADR-019)
      context: ..
      dockerfile: NLPInsight-Analyzer/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=models
      - TRANSFORMERS_CACHE=/app/.cache/huggingface
    volumes:
      - ./artifacts:/app/artifacts
      - ./models:/app/models
    command: ["uvicorn", "app.fastapi_app:app", "--host", "0.0.0.0", "--port", "8000"]
