# ML-MLOps Portfolio Demo Stack
# Levanta los 3 proyectos principales + MLflow Tracking Server
# Uso: docker-compose -f docker-compose.demo.yml up --build

services:
  # MLflow Tracking Server (central)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlflow
      - ./mlruns:/mlruns
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow/mlflow.db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ml-network

  # BankChurn Predictor API
  bankchurn:
    image: ml-portfolio-bankchurn:latest
    build:
      context: ./BankChurn-Predictor
      dockerfile: Dockerfile
    container_name: bankchurn-api
    ports:
      - "8001:8000"
    volumes:
      - ./BankChurn-Predictor/data:/app/data:ro
      - ./BankChurn-Predictor/models:/app/models:ro
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    depends_on:
      mlflow:
        condition: service_started
    networks:
      - ml-network
    restart: unless-stopped

  # CarVision Market Intelligence API
  carvision:
    image: ml-portfolio-carvision-api:latest
    build:
      context: ./CarVision-Market-Intelligence
      dockerfile: Dockerfile
      target: api
    container_name: carvision-api
    ports:
      - "8002:8000"
    volumes:
      - ./CarVision-Market-Intelligence/data:/app/data:ro
      - ./CarVision-Market-Intelligence/models:/app/models:ro
      - ./CarVision-Market-Intelligence/artifacts:/app/artifacts:ro
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    depends_on:
      mlflow:
        condition: service_started
    networks:
      - ml-network
    restart: unless-stopped

  # CarVision Streamlit Dashboard (optional — requires streamlit in image)
  carvision-dashboard:
    image: ml-portfolio-carvision-dashboard:latest
    build:
      context: ./CarVision-Market-Intelligence
      dockerfile: Dockerfile
      target: dashboard
    container_name: carvision-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./CarVision-Market-Intelligence/data:/app/data:ro
      - ./CarVision-Market-Intelligence/models:/app/models:ro
      - ./CarVision-Market-Intelligence/artifacts:/app/artifacts:ro
    environment:
      - PYTHONUNBUFFERED=1
      - ARTIFACTS_DIR=artifacts
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - carvision
    networks:
      - ml-network
    restart: unless-stopped
    profiles:
      - dashboard

  # NLPInsight Analyzer API (Sentiment Analysis with TF-IDF + sklearn)
  nlpinsight:
    image: ml-portfolio-nlpinsight:latest
    build:
      context: ./NLPInsight-Analyzer
      dockerfile: Dockerfile
    container_name: nlpinsight-api
    ports:
      - "8003:8000"
    volumes:
      - ./NLPInsight-Analyzer/data:/app/data:ro
      - ./NLPInsight-Analyzer/models:/app/models:ro
      - ./NLPInsight-Analyzer/artifacts:/app/artifacts:ro
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - MODEL_PATH=models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mlflow:
        condition: service_started
    networks:
      - ml-network
    restart: unless-stopped

  # ChicagoTaxi Demand Pipeline API
  chicagotaxi:
    image: ml-portfolio-chicagotaxi:latest
    build:
      context: ./ChicagoTaxi-Demand-Pipeline
      dockerfile: Dockerfile
    container_name: chicagotaxi-api
    ports:
      - "8004:8000"
    volumes:
      - ./ChicagoTaxi-Demand-Pipeline/models:/app/models:ro
      - ./data/processed/taxi_predictions:/app/data/processed/taxi_predictions:ro
    environment:
      - PREDICTIONS_PATH=/app/data/processed/taxi_predictions
      - PYTHONUNBUFFERED=1
      - LOG_FORMAT=json
      - LOG_LEVEL=INFO
      - SERVICE_NAME=chicagotaxi
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ml-network
    restart: unless-stopped

  # Prometheus (Monitoring - Opcional)
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus-config.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - ml-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana (Dashboards - Opcional)
  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - ml-network
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  mlflow-artifacts:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  ml-network:
    driver: bridge
    name: ml-mlops-network
