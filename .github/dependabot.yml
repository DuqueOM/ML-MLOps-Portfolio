# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 3
    # Patch and minor travel together and merge on green
    # (.github/workflows/dependabot-auto-merge.yml). A MAJOR arrives on its
    # own and waits for a person: it asks whether a boundary should move, and
    # CI cannot answer that.
    groups:
      actions-low-risk:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # Docker (base images of the three services)
  - package-ecosystem: "docker"
    directories:
      - "/BankChurn-Predictor"
      - "/NLPInsight-Analyzer"
      - "/ChicagoTaxi-Demand-Pipeline"
    schedule:
      interval: "monthly"
    groups:
      images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # The portfolio runs ONE Python minor: 3.13 in the images, CI,
      # .python-version and requires-python (<3.14). Moving to 3.14 is a
      # deliberate portfolio-wide change (ADR-019), never an image bump.
      - dependency-name: "python"
        versions: [">=3.14"]
      # The uv that installs the lock in the images moves together with
      # UV_VERSION in the workflows, in one PR — not per Dockerfile.
      - dependency-name: "ghcr.io/astral-sh/uv"

  # ---------------------------------------------------------------------
  # Python. This was ABSENT while the repository carried ten files that
  # declare Python dependencies: requirements-docs.txt, requirements-dvc.txt,
  # three project requirement sets and four pyproject.toml files. With pip
  # unwatched none of them ever received an update PR — a control that looks
  # present and reports nothing.
  #
  # Since ADR-019 the services and common_utils are ONE uv workspace with one
  # uv.lock, watched by the `uv` ecosystem. pip keeps only the two root
  # requirement files that are not part of the workspace (MkDocs, DVC).
  #
  # `directory:` is resolved literally and does not recurse, so every
  # directory that declares dependencies is listed. If an update ever lands
  # in a member's pyproject.toml without uv.lock, `uv lock --check`
  # (ci-mlops.yml, Quality Gates) fails that PR instead of letting the lock
  # and the declaration drift.
  #
  # `increase` raises the floor and PRESERVES the `~=` shape. Dependabot's
  # pip default WIDENS a constraint (`~=2.2` becomes `>=2.2,<4.0`), which
  # admits a major without anyone deciding to take it — the thing ADR-005's
  # `~=` exists to prevent. That is the reason, and it does not depend on any
  # one package. (This comment used to say "numpy 2.x silently corrupted
  # joblib-serialised models here". These services moved to numpy 2.2
  # deliberately in v3.5.0, and a measured round trip does not reproduce a
  # silent corruption; see ADR-005's amendment of 2026-10-23.)
  # ---------------------------------------------------------------------
  # ONE entry, at the workspace root. The four members used to be listed too,
  # and that is what produced the broken PRs of 2026-10-31 (#349-#353):
  # Dependabot visits `/` first and then each member again, and the member
  # visits propose the same update from the member's own pyproject.toml, with
  # no uv.lock change and a WIDENED range (`~=2.3.0` -> `>=2.3,<3.2`, which
  # admits pandas 3). `uv lock --check` rejected them, correctly, and each was
  # a duplicate of the root PR that does carry the lock (#345-#347).
  #
  # Why dropping the members loses nothing, MEASURED (not documented: GitHub's
  # reference says nothing about uv workspaces). In run 41211368341 the `/` job
  # reported a dependency snapshot and a "Checking if ..." line for 46 of the
  # 46 direct dependencies declared across the five pyproject.toml files
  # (extras such as `dask[dataframe]` included), and its PRs edit the members'
  # pyproject.toml and uv.lock together. If a member ever stops being seen
  # from `/`, list it here again and add its name to this comment.
  - package-ecosystem: "uv"
    directory: "/"
    versioning-strategy: increase
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 5
    groups:
      python-low-risk:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # The 3.11-era ignores (numpy >= 2.5, scipy >= 1.18, shap >= 0.52,
    # xgboost >= 3.3 — each the first release requiring Python >= 3.12, after
    # #315) were lifted by ADR-019: 3.11 left the CI matrix and the images,
    # and the workspace runs 3.13 only. A dependency that drops 3.13 is now
    # stopped by the resolver itself (requires-python = ">=3.13,<3.14").
    # Three majors held, because no advisory asks for them and ADR-018 keeps
    # this repository in maintenance mode: a data-stack major means retraining
    # or revalidating the served artifacts, and the services gain nothing from
    # it. Checked 2026-11-02: Trivy on uv.lock with that day's database finds 0
    # advisories at any severity, and the lock pins pandas 2.3.3, transformers
    # 4.48.3 and protobuf 5.29.6. #345-#347 were the proposals, green in CI and
    # still closed, because "CI passes" says nothing about artifacts trained
    # under the old versions.
    #
    # `ignore` filters SECURITY updates too (GitHub's reference: "filters out
    # any ignored dependencies or versions"), so this is not a safe parking
    # place. LIFT an entry when (a) an advisory lists a fix only in that major
    # (Trivy's gate will show it on the next PR), or (b) the service that uses
    # it is retrained and revalidated on the new major.
    ignore:
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "protobuf"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"

  # `pip` at `/` also reads the root pyproject.toml, which the `uv` entry above
  # owns together with uv.lock. It proposed `black` there on 2026-10-31
  # (#342): a floor raised with no lock change, which `uv lock --check`
  # rejects, and it did so again at 15:09 after the workspace migration landed.
  # `exclude-paths` (GitHub's reference: paths relative to `directory`, per
  # ecosystem) leaves this entry the two requirement files its comment names.
  - package-ecosystem: "pip"
    directory: "/"   # requirements-docs.txt, requirements-dvc.txt
    exclude-paths:
      - "pyproject.toml"
    versioning-strategy: increase
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 3
    groups:
      python-tools-low-risk:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"
