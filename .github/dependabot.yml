# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 3
    # Patch and minor travel together and merge on green
    # (.github/workflows/dependabot-auto-merge.yml). A MAJOR arrives on its
    # own and waits for a person: it asks whether a boundary should move, and
    # CI cannot answer that.
    groups:
      actions-low-risk:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # Docker
  # Note: Ignore pre-release Python versions (3.14+) as they lack wheel support
  - package-ecosystem: "docker"
    directory: "/BankChurn-Predictor"
    schedule:
      interval: "monthly"
    groups:
      images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Ignore Python 3.14+ (pre-release/development versions)
      - dependency-name: "python"
        versions: [">=3.14"]

  - package-ecosystem: "docker"
    directory: "/NLPInsight-Analyzer"
    schedule:
      interval: "monthly"
    groups:
      images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Ignore Python 3.14+ (pre-release/development versions)
      - dependency-name: "python"
        versions: [">=3.14"]

  # ---------------------------------------------------------------------
  # Python. This was ABSENT while the repository carried ten files that
  # declare Python dependencies: requirements-docs.txt, requirements-dvc.txt,
  # three project requirement sets and four pyproject.toml files. With pip
  # unwatched none of them ever received an update PR — a control that looks
  # present and reports nothing.
  #
  # `directory:` is resolved literally and does not recurse, so every
  # directory that declares dependencies is listed.
  #
  # `increase` raises the floor and PRESERVES the `~=` shape. Dependabot's
  # pip default WIDENS a constraint (`~=2.2` becomes `>=2.2,<4.0`), which
  # admits a major without anyone deciding to take it — the thing ADR-005's
  # `~=` exists to prevent. That is the reason, and it does not depend on any
  # one package. (This comment used to say "numpy 2.x silently corrupted
  # joblib-serialised models here". These services moved to numpy 2.2
  # deliberately in v3.5.0, and a measured round trip does not reproduce a
  # silent corruption; see ADR-005's amendment of 2026-10-23.)
  # ---------------------------------------------------------------------
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/BankChurn-Predictor"
      - "/ChicagoTaxi-Demand-Pipeline"
      - "/NLPInsight-Analyzer"
      - "/common_utils"
    versioning-strategy: increase
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 5
    groups:
      python-low-risk:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Python 3.11 is supported here and it is not a formality: CI tests it
    # (ci-mlops.yml matrix 3.11 / 3.12), one service image is
    # python:3.11-slim-bookworm, and the projects declare requires-python
    # >= 3.10 / >= 3.11. These four packages dropped 3.11 in a MINOR release,
    # so the low-risk group carried them in and #315 failed every job with
    # "No matching distribution found for numpy>=2.5.4" on 3.11. Each
    # threshold is the first stable release whose Requires-Python is >= 3.12,
    # read from PyPI — not the version Dependabot happened to propose (shap
    # crossed at 0.52, three minors before the 0.54 in that PR). Lift these
    # together when 3.11 leaves the matrix and the 3.11 image.
    ignore:
      - dependency-name: "numpy"
        versions: [">=2.5"]
      - dependency-name: "scipy"
        versions: [">=1.18"]
      - dependency-name: "shap"
        versions: [">=0.52"]
      - dependency-name: "xgboost"
        versions: [">=3.3"]
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"
