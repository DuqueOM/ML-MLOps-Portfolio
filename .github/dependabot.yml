# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 3
    # Patch and minor travel together and merge on green
    # (.github/workflows/dependabot-auto-merge.yml). A MAJOR arrives on its
    # own and waits for a person: it asks whether a boundary should move, and
    # CI cannot answer that.
    groups:
      actions-low-risk:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # Docker (base images of the three services)
  - package-ecosystem: "docker"
    directories:
      - "/BankChurn-Predictor"
      - "/NLPInsight-Analyzer"
      - "/ChicagoTaxi-Demand-Pipeline"
    schedule:
      interval: "monthly"
    groups:
      images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # The portfolio runs ONE Python minor: 3.13 in the images, CI,
      # .python-version and requires-python (<3.14). Moving to 3.14 is a
      # deliberate portfolio-wide change (ADR-019), never an image bump.
      - dependency-name: "python"
        versions: [">=3.14"]
      # The uv that installs the lock in the images moves together with
      # UV_VERSION in the workflows, in one PR — not per Dockerfile.
      - dependency-name: "ghcr.io/astral-sh/uv"

  # ---------------------------------------------------------------------
  # Python. This was ABSENT while the repository carried ten files that
  # declare Python dependencies: requirements-docs.txt, requirements-dvc.txt,
  # three project requirement sets and four pyproject.toml files. With pip
  # unwatched none of them ever received an update PR — a control that looks
  # present and reports nothing.
  #
  # Since ADR-019 the services and common_utils are ONE uv workspace with one
  # uv.lock, watched by the `uv` ecosystem. pip keeps only the two root
  # requirement files that are not part of the workspace (MkDocs, DVC).
  #
  # `directory:` is resolved literally and does not recurse, so every
  # directory that declares dependencies is listed. If an update ever lands
  # in a member's pyproject.toml without uv.lock, `uv lock --check`
  # (ci-mlops.yml, Quality Gates) fails that PR instead of letting the lock
  # and the declaration drift.
  #
  # `increase` raises the floor and PRESERVES the `~=` shape. Dependabot's
  # pip default WIDENS a constraint (`~=2.2` becomes `>=2.2,<4.0`), which
  # admits a major without anyone deciding to take it — the thing ADR-005's
  # `~=` exists to prevent. That is the reason, and it does not depend on any
  # one package. (This comment used to say "numpy 2.x silently corrupted
  # joblib-serialised models here". These services moved to numpy 2.2
  # deliberately in v3.5.0, and a measured round trip does not reproduce a
  # silent corruption; see ADR-005's amendment of 2026-10-23.)
  # ---------------------------------------------------------------------
  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/BankChurn-Predictor"
      - "/ChicagoTaxi-Demand-Pipeline"
      - "/NLPInsight-Analyzer"
      - "/common_utils"
    versioning-strategy: increase
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 5
    groups:
      python-low-risk:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # The 3.11-era ignores (numpy >= 2.5, scipy >= 1.18, shap >= 0.52,
    # xgboost >= 3.3 — each the first release requiring Python >= 3.12, after
    # #315) were lifted by ADR-019: 3.11 left the CI matrix and the images,
    # and the workspace runs 3.13 only. A dependency that drops 3.13 is now
    # stopped by the resolver itself (requires-python = ">=3.13,<3.14").
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "pip"
    directory: "/"   # requirements-docs.txt, requirements-dvc.txt
    versioning-strategy: increase
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 3
    groups:
      python-tools-low-risk:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"
