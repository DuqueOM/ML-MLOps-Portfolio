# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # Docker
  # Note: Ignore pre-release Python versions (3.14+) as they lack wheel support
  - package-ecosystem: "docker"
    directory: "/BankChurn-Predictor"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Ignore Python 3.14+ (pre-release/development versions)
      - dependency-name: "python"
        versions: [">=3.14"]

  - package-ecosystem: "docker"
    directory: "/NLPInsight-Analyzer"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Ignore Python 3.14+ (pre-release/development versions)
      - dependency-name: "python"
        versions: [">=3.14"]
