version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5

  # Python dependencies - BankChurn-Predictor
  - package-ecosystem: "pip"
    directory: "/BankChurn-Predictor"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
      - "BankChurn-Predictor"
    open-pull-requests-limit: 5

  # Python dependencies - CarVision-Market-Intelligence
  - package-ecosystem: "pip"
    directory: "/CarVision-Market-Intelligence"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
      - "CarVision"
    open-pull-requests-limit: 5

  # Python dependencies - TelecomAI-Customer-Intelligence
  - package-ecosystem: "pip"
    directory: "/TelecomAI-Customer-Intelligence"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
      - "TelecomAI"
    open-pull-requests-limit: 5

  # Docker
  - package-ecosystem: "docker"
    directory: "/infra"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5
