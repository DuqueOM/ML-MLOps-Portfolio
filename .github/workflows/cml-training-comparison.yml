name: CML - Model Training Comparison

# DISABLED: Redundant with MLflow experiment tracking.
# This workflow compares metrics between PR and main branches,
# but MLflow already provides comprehensive experiment comparison.
# Re-enable if needed for specific PR-based model comparison.
#
# on:
#   pull_request:
#     branches: [ main ]
#     paths:
#       - '**/src/**'
#       - '**/main.py'
#       - '**/train*.py'
#       - '**/configs/*.yaml'

on:
  workflow_dispatch:  # Manual trigger only (for testing)

env:
  PYTHON_VERSION: '3.13'  # = the images' runtime (ADR-019)
  UV_VERSION: '0.11.19'   # = the version that wrote uv.lock

jobs:
  train-and-compare:
    name: Train & Compare Models
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    strategy:
      matrix:
        project:
          - BankChurn-Predictor
    
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies (from uv.lock — ADR-019)
        # The PR branch's lock. Both trainings below run in this environment,
        # so the comparison isolates code changes from dependency drift.
        run: |
          uv sync --frozen --package bankchurn-predictor --all-groups
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      # CML setup removed: using plain GitHub Actions report + artifacts only

      - name: Train model on PR branch
        id: train_pr
        working-directory: ${{ matrix.project }}
        continue-on-error: true
        run: |
          mkdir -p results
          python main.py --seed 42 train \
            --config configs/config.yaml \
            --input data/raw/Churn.csv \
            --metrics-output results/training_results.json
          
          # Extract metrics from training results
          if [ -f results/training_results.json ]; then
            cp results/training_results.json pr_metrics.json
          fi
      
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main
          clean: false
      
      - name: Train model on main branch
        id: train_main
        working-directory: ${{ matrix.project }}
        continue-on-error: true
        run: |
          mkdir -p results_main
          python main.py --seed 42 train \
            --config configs/config.yaml \
            --input data/raw/Churn.csv \
            --metrics-output results/training_results.json
          
          # Extract metrics from training results
          if [ -f results/training_results.json ]; then
            mv results/training_results.json results_main/training_results.json
            cp results_main/training_results.json main_metrics.json
          fi
      
      - name: Generate comparison report
        if: always()
        working-directory: ${{ matrix.project }}
        run: |
          echo "# 📊 Model Training Comparison - ${{ matrix.project }}" > report.md
          echo "" >> report.md
          echo "Comparing PR branch vs main branch" >> report.md
          echo "" >> report.md
          
          # Extract and compare metrics
          if [ -f pr_metrics.json ] && [ -f main_metrics.json ]; then
            echo "## Metrics Comparison" >> report.md
            echo "" >> report.md
            echo "| Metric | Main Branch | PR Branch | Δ Change |" >> report.md
            echo "|--------|-------------|-----------|----------|" >> report.md
            
            # Parse JSON and create comparison table
            python << 'PYEOF'
          import json
          import sys
          
          try:
              with open('pr_metrics.json', 'r') as f:
                  pr_metrics = json.load(f)
              with open('main_metrics.json', 'r') as f:
                  main_metrics = json.load(f)
              
              metrics_to_compare = ['roc_auc', 'accuracy', 'f1_score', 'precision', 'recall']
              
              for metric in metrics_to_compare:
                  if metric in pr_metrics and metric in main_metrics:
                      main_val = float(main_metrics[metric])
                      pr_val = float(pr_metrics[metric])
                      delta = pr_val - main_val
                      delta_pct = (delta / main_val * 100) if main_val != 0 else 0
                      
                      emoji = "📈" if delta > 0 else "📉" if delta < 0 else "➡️"
                      
                      print(f"| {metric} | {main_val:.4f} | {pr_val:.4f} | {emoji} {delta:+.4f} ({delta_pct:+.2f}%) |")
          except Exception as e:
              print(f"Error comparing metrics: {e}", file=sys.stderr)
          PYEOF
            
          fi >> report.md
          
          echo "" >> report.md
          echo "## Training Info" >> report.md
          echo "- **PR Branch:** ${{ github.event.pull_request.head.ref }}" >> report.md
          echo "- **Base Branch:** ${{ github.event.pull_request.base.ref }}" >> report.md
          echo "- **Commit SHA:** ${{ github.event.pull_request.head.sha }}" >> report.md
          echo "" >> report.md
      
      - name: Upload metrics artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-comparison-${{ matrix.project }}
          path: |
            ${{ matrix.project }}/pr_metrics.json
            ${{ matrix.project }}/main_metrics.json
            ${{ matrix.project }}/report.md
          retention-days: 30
