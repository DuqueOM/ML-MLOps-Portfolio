name: CI/CD MLOps Portfolio

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run full integration tests'
        required: false
        default: 'true'
        type: boolean

# Global permissions for all jobs
permissions:
  actions: read
  contents: read
  security-events: write  # Required for CodeQL/SARIF upload

env:
  PYTHON_VERSION: '3.12'
  MLFLOW_TRACKING_URI: http://localhost:5000

jobs:
  # Job 1: Unit tests per project
  tests:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        project:
          - BankChurn-Predictor
          - NLPInsight-Analyzer
          - ChicagoTaxi-Demand-Pipeline
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: mlflow
          POSTGRES_USER: mlflow
          POSTGRES_PASSWORD: mlflow_test
        options: >-
          --health-cmd "pg_isready -U mlflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for gitleaks history scan
          lfs: true  # Download Git LFS files
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.in ]; then
            pip install -r requirements.in
          elif [ -f requirements.txt ]; then
            # Strip hashes to avoid --require-hashes errors with transitive deps
            grep -v '^[[:space:]]*--hash=' requirements.txt | \
            grep -v '^[[:space:]]*--require-hashes' | \
            sed 's/ \\$//' | \
            grep -v '^[[:space:]]*#' | \
            grep -v '^[[:space:]]*$' > requirements_no_hash.txt
            pip install -r requirements_no_hash.txt
          fi
          pip install pytest pytest-cov httpx flake8 "black==26.1.0" isort mypy
          pip install -e ../common_utils
      
      - name: Run linting
        working-directory: ${{ matrix.project }}
        run: |
          pip install flake8 "black==26.1.0" isort mypy
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          black --check src/ app/
          isort --check-only src/ app/
      
      - name: Run tests with coverage
        working-directory: ${{ matrix.project }}
        run: |
          # Coverage thresholds: BankChurn 85%, NLPInsight 85%, ChicagoTaxi 85%
          if [ "${{ matrix.project }}" = "BankChurn-Predictor" ]; then
            COV_TARGET="src"
            THRESHOLD=85
          elif [ "${{ matrix.project }}" = "ChicagoTaxi-Demand-Pipeline" ]; then
            COV_TARGET="src/chicagotaxi"
            THRESHOLD=85
          else
            COV_TARGET="src/nlpinsight"
            THRESHOLD=85
          fi
          pytest --maxfail=1 --disable-warnings -q \
            -m "not slow" \
            --cov=$COV_TARGET --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=$THRESHOLD
      
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.project }}/coverage.xml
          flags: ${{ matrix.project }}
          name: ${{ matrix.project }}-coverage-${{ matrix.python-version }}
          fail_ci_if_error: false
      
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.project }}-py${{ matrix.python-version }}
          path: ${{ matrix.project }}/coverage.xml
          retention-days: 30
  
  # Job 2: Quality Gates - Enforce code quality standards
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: [tests]
    if: always() && needs.tests.result != 'cancelled'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install quality tools
        run: pip install "black==26.1.0" flake8 coverage mypy
      
      - name: Check Black formatting
        run: |
          echo "::group::Black Formatting Check"
          FAIL=0
          for project in BankChurn-Predictor NLPInsight-Analyzer ChicagoTaxi-Demand-Pipeline; do
            if [ -d "$project/src" ] || [ -d "$project/app" ]; then
              black --check "$project/app" 2>/dev/null || FAIL=1
              [ -d "$project/src" ] && black --check "$project/src" 2>/dev/null || true
            fi
          done
          echo "::endgroup::"
          if [ "$FAIL" -eq 1 ]; then
            echo "::warning::Some files need formatting. Run 'black .' to fix."
          fi
      
      - name: Check Flake8 critical errors
        run: |
          echo "::group::Flake8 Critical Errors"
          for project in BankChurn-Predictor NLPInsight-Analyzer ChicagoTaxi-Demand-Pipeline; do
            if [ -d "$project/src" ]; then
              flake8 "$project/src" --count --select=E9,F63,F7,F82 --show-source --statistics
            fi
            if [ -d "$project/app" ]; then
              flake8 "$project/app" --count --select=E9,F63,F7,F82 --show-source --statistics
            fi
          done
          echo "::endgroup::"
      
      - name: Run mypy type checks
        run: |
          echo "::group::Mypy Type Checking"
          mypy common_utils/ --config-file mypy.ini || true
          for project in BankChurn-Predictor NLPInsight-Analyzer ChicagoTaxi-Demand-Pipeline; do
            if [ -d "$project/app" ]; then
              echo "--- $project ---"
              mypy "$project/app/" --config-file mypy.ini || true
            fi
          done
          echo "::endgroup::"
      
      - name: Verify tests passed
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "::error::Tests did not pass. Quality gate failed."
            exit 1
          fi
          echo "✅ All quality gates passed"
  
  # Job 3: Security scans
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      
      - name: Install security tools
        run: pip install bandit pip-audit
      
      - name: Run Bandit security scan
        run: |
          mkdir -p reports
          # JSON report for downstream analysis (allow failure for report generation)
          bandit -r BankChurn-Predictor/src NLPInsight-Analyzer/src \
            -f json -o reports/bandit-report.json -ll || true
          # Blocking scan: fail on HIGH+ severity issues
          bandit -r BankChurn-Predictor/src NLPInsight-Analyzer/src \
            --severity-level high
      
      - name: Run pip-audit dependency scan
        run: |
          pip-audit --format=json > reports/pip-audit-report.json || true
          pip-audit || true
      
      - name: Check for critical vulnerabilities
        run: |
          # Check Bandit for HIGH severity issues
          if [ -f reports/bandit-report.json ]; then
            HIGH=$(python3 -c "import json; d=json.load(open('reports/bandit-report.json')); print(d.get('metrics',{}).get('_totals',{}).get('SEVERITY.HIGH',0))" 2>/dev/null || echo 0)
            if [ "$HIGH" -gt 0 ]; then
              echo "::error::Critical security issues found in Bandit scan"
              exit 1
            fi
          fi
          echo "✅ No critical security issues found"
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            reports/bandit-report.json
            reports/pip-audit-report.json
          retention-days: 30
  
  # Job 3: Docker builds & scans (with GitHub Actions cache)
  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - BankChurn-Predictor
          - NLPInsight-Analyzer
          - ChicagoTaxi-Demand-Pipeline
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image (with cache)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.project }}
          file: ${{ matrix.project }}/Dockerfile
          push: false
          load: true
          tags: ml-portfolio:${{ matrix.project }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.project }}-v2
          cache-to: type=gha,mode=max,scope=${{ matrix.project }}-v2
      
      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.29.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          image-ref: ml-portfolio:${{ matrix.project }}-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.project }}.sarif'
          severity: 'CRITICAL,HIGH'
          skip-setup-trivy: true
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results-${{ matrix.project }}.sarif'
  
  # Job 4: E2E Test (BankChurn)
  e2e:
    name: End-to-End Test
    runs-on: ubuntu-latest
    needs: [tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        working-directory: BankChurn-Predictor
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.in ]; then
            pip install -r requirements.in
          elif [ -f requirements.txt ]; then
            # Strip hashes to avoid --require-hashes errors with transitive deps
            grep -v '^[[:space:]]*--hash=' requirements.txt | \
            grep -v '^[[:space:]]*--require-hashes' | \
            sed 's/ \\$//' | \
            grep -v '^[[:space:]]*#' | \
            grep -v '^[[:space:]]*$' > requirements_no_hash.txt
            pip install -r requirements_no_hash.txt
          fi
      
      - name: Generate synthetic data for E2E
        working-directory: BankChurn-Predictor
        run: |
          mkdir -p data/raw
          python - <<'EOF'
          import pandas as pd
          import numpy as np
          np.random.seed(42)
          n = 500
          df = pd.DataFrame({
              'RowNumber': range(1, n+1),
              'CustomerId': np.random.randint(15000000, 16000000, n),
              'Surname': ['Smith'] * n,
              'CreditScore': np.random.randint(350, 850, n),
              'Geography': np.random.choice(['France', 'Germany', 'Spain'], n),
              'Gender': np.random.choice(['Male', 'Female'], n),
              'Age': np.random.randint(18, 70, n),
              'Tenure': np.random.randint(0, 10, n),
              'Balance': np.round(np.random.uniform(0, 250000, n), 2),
              'NumOfProducts': np.random.randint(1, 4, n),
              'HasCrCard': np.random.randint(0, 2, n),
              'IsActiveMember': np.random.randint(0, 2, n),
              'EstimatedSalary': np.round(np.random.uniform(10000, 200000, n), 2),
              'Exited': np.random.randint(0, 2, n),
          })
          df.to_csv('data/raw/Churn.csv', index=False)
          print(f'Generated {n} rows → data/raw/Churn.csv')
          EOF

      - name: Run E2E pipeline
        run: |
          chmod +x scripts/run_e2e.sh
          bash scripts/run_e2e.sh
        env:
          E2E_DATA_FILE: data/raw/Churn.csv

  # Job 5: Cross-Project Integration Test (only on main or manual trigger)
  integration-test:
    name: Cross-Project Integration
    runs-on: ubuntu-latest
    needs: [docker]
    # Only run on: push to main, or manual workflow_dispatch
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_integration == true)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Compose
        run: docker compose version
      
      - name: Build demo images for docker-compose (no cache)
        uses: docker/build-push-action@v5
        with:
          context: BankChurn-Predictor
          file: BankChurn-Predictor/Dockerfile
          push: false
          load: true
          tags: ml-portfolio-bankchurn:latest
          no-cache: true
      
      - name: Build NLPInsight image (no cache)
        uses: docker/build-push-action@v5
        with:
          context: NLPInsight-Analyzer
          file: NLPInsight-Analyzer/Dockerfile
          push: false
          load: true
          tags: ml-portfolio-nlpinsight:latest
          no-cache: true

      - name: Build ChicagoTaxi image (no cache)
        uses: docker/build-push-action@v5
        with:
          context: ChicagoTaxi-Demand-Pipeline
          file: ChicagoTaxi-Demand-Pipeline/Dockerfile
          push: false
          load: true
          tags: ml-portfolio-chicagotaxi:latest
          no-cache: true
      
      - name: Generate CI test models
        run: |
          pip install "scikit-learn~=1.6.0" joblib "numpy~=1.26.0" pandas
          python scripts/generate_ci_test_models.py

      - name: Spin up Demo Stack
        run: |
          # Start services using pre-built images
          docker compose -f docker-compose.demo.yml up -d

          # Wait for services to be ready
          echo "Waiting for services to initialize..."
          sleep 60

          # Show container status
          docker compose -f docker-compose.demo.yml ps -a

          # Dump full logs per service so crash reasons are visible
          echo "=== Container logs after initial wait ==="
          for svc_port in "bankchurn:8001" "nlpinsight:8003" "chicagotaxi:8004"; do
            svc="${svc_port%%:*}"
            echo "--- $svc logs ---"
            docker compose -f docker-compose.demo.yml logs "$svc" --tail 80
          done

          # Wait for health endpoints using host-side curl on mapped ports
          echo "Waiting for health checks..."
          declare -A SVC_PORTS=([bankchurn]=8001 [nlpinsight]=8003 [chicagotaxi]=8004)
          for svc in bankchurn nlpinsight chicagotaxi; do
            port="${SVC_PORTS[$svc]}"
            echo "Checking $svc on port $port..."
            for i in {1..12}; do
              if curl -sf "http://localhost:$port/health" > /dev/null 2>&1; then
                echo "  $svc is up"
                break
              fi
              echo "  Attempt $i/12 - $svc not ready, waiting 10s..."
              sleep 10
            done
            echo "--- $svc final logs ---"
            docker compose -f docker-compose.demo.yml logs "$svc" --tail 30
          done

          # Final status
          docker compose -f docker-compose.demo.yml ps -a

      - name: Pre-flight container smoke test
        if: always()
        run: |
          echo "=== Container exit codes ==="
          docker compose -f docker-compose.demo.yml ps -a
          echo ""
          echo "=== Import smoke test (runs even if container exited) ==="
          PYCHECK="import sys; print('Python:', sys.version); import fastapi; print('fastapi OK:', fastapi.__version__); import sklearn; print('sklearn OK:', sklearn.__version__); import numpy; print('numpy OK:', numpy.__version__); import scipy; print('scipy OK:', scipy.__version__); import pandas; print('pandas OK:', pandas.__version__); print('ALL IMPORTS OK')"
          for svc in bankchurn nlpinsight; do
            echo "--- $svc python import check ---"
            docker compose -f docker-compose.demo.yml run --rm --no-deps "$svc" python -c "$PYCHECK" 2>&1 || echo "CONTAINER RUN FAILED for $svc"
          done

      - name: Diagnostic - Check all containers and model files
        if: always()
        run: |
          echo "=== Container status ==="
          docker compose -f docker-compose.demo.yml ps -a
          echo ""
          echo "=== sklearn versions inside containers ==="
          for svc in bankchurn nlpinsight chicagotaxi; do
            echo "--- $svc ---"
            docker compose -f docker-compose.demo.yml exec -T $svc python -c "import sklearn; print(f'sklearn={sklearn.__version__}')" 2>&1 || echo "FAILED"
          done
          echo ""
          echo "=== Model files on HOST (all 3 projects) ==="
          for proj in BankChurn-Predictor NLPInsight-Analyzer; do
            echo "--- $proj ---"
            ls -la $proj/models/model.joblib 2>&1 || echo "Not found (models are downloaded at runtime via Init Container)"
          done
          echo "--- NLPInsight-Analyzer ---"
          ls -la NLPInsight-Analyzer/models/ 2>&1 || echo "Not found (transformer model downloaded at runtime)"
          echo ""
          echo "=== Model files INSIDE containers ==="
          for svc in bankchurn nlpinsight; do
            echo "--- $svc ---"
            docker compose -f docker-compose.demo.yml exec -T $svc ls -la models/model.joblib 2>&1 || echo "NOT FOUND (expected: loaded via volume mount or Init Container)"
          done
          echo "--- nlpinsight ---"
          docker compose -f docker-compose.demo.yml exec -T nlpinsight ls -la models/ 2>&1 || echo "NOT FOUND"
          echo ""
          echo "=== Git LFS status ==="
          git lfs ls-files 2>&1 | grep model.joblib || echo "No LFS model files found (expected in CI - models loaded at runtime)"

      - name: Install test dependencies
        run: pip install pytest requests

      - name: Run Integration Tests
        run: |
          chmod +x scripts/run_demo_tests.sh
          bash scripts/run_demo_tests.sh
      
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Container Status ==="
          docker compose -f docker-compose.demo.yml ps -a
          echo "=== All Logs ==="
          docker compose -f docker-compose.demo.yml logs --tail 50

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.demo.yml down

  # Job 6: Performance Benchmarks (on main push only)
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: [tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib pyyaml pydantic
      
      - name: Run benchmarks
        run: |
          python scripts/benchmark_optimizations.py
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            benchmark_results.txt
            benchmark_*.json
          retention-days: 90
      
      - name: Comment benchmark results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('benchmark_results.txt')) {
              const results = fs.readFileSync('benchmark_results.txt', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## 📊 Performance Benchmarks\n\n```\n' + results + '\n```'
              });
            }

  # Job 7: Integration report
  integration-report:
    name: Generate Integration Report
    runs-on: ubuntu-latest
    needs: [tests, quality-gates, security, docker]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Generate summary report
        run: |
          echo "# 📊 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests: ${{ needs.tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🎯 Quality Gates: ${{ needs.quality-gates.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🔒 Security: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🐳 Docker: ${{ needs.docker.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

  # Job 6: Model cards validation
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for model cards
        run: |
          echo "Checking for model_card.md files..."
          find . -name "model_card.md" -type f
          
          # Verify model cards exist in main projects
          for project in BankChurn-Predictor NLPInsight-Analyzer ChicagoTaxi-Demand-Pipeline; do
            if [ ! -f "$project/model_card.md" ]; then
              echo "⚠️  Missing model_card.md in $project"
            else
              echo "✅ Found model_card.md in $project"
            fi
          done
      
      - name: Check data cards
        run: |
          echo "Checking for data_card.md files..."
          find . -name "data_card.md" -type f
      
      - name: Validate README files
        run: |
          echo "Checking README.md in all projects..."
          for dir in */; do
            if [ -d "$dir" ] && [ ! -f "${dir}README.md" ]; then
              echo "⚠️  Missing README.md in $dir"
            fi
          done

  # Job 8: Build & Push Docker Images to GHCR (on main push only)
  ghcr-publish:
    name: Publish to GHCR
    needs: [tests, security, docker]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        project:
          - BankChurn-Predictor
          - NLPInsight-Analyzer
          - ChicagoTaxi-Demand-Pipeline
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.project }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.project }}
          file: ${{ matrix.project }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
