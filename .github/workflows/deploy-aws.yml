name: Deploy to EKS

on:
  push:
    branches: [main]
    paths:
      - 'BankChurn-Predictor/**'
      - 'NLPInsight-Analyzer/**'
      - 'ChicagoTaxi-Demand-Pipeline/**'
      - 'k8s/overlays/aws/**'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (all, bankchurn, nlpinsight, chicagotaxi)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - bankchurn
          - nlpinsight
          - chicagotaxi
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  EKS_CLUSTER: ${{ secrets.EKS_CLUSTER_NAME }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION || 'us-east-1' }}.amazonaws.com
  NAMESPACE: ml-portfolio

jobs:
  # ---------------------------------------------------------------------------
  # Detect which services changed (skip on manual dispatch)
  # ---------------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      bankchurn: ${{ steps.filter.outputs.bankchurn }}
      nlpinsight: ${{ steps.filter.outputs.nlpinsight }}
      chicagotaxi: ${{ steps.filter.outputs.chicagotaxi }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bankchurn:
              - 'BankChurn-Predictor/**'
            nlpinsight:
              - 'NLPInsight-Analyzer/**'
            chicagotaxi:
              - 'ChicagoTaxi-Demand-Pipeline/**'
            k8s:
              - 'k8s/overlays/aws/**'

  # ---------------------------------------------------------------------------
  # Build & Push Docker images to ECR
  # ---------------------------------------------------------------------------
  build-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: bankchurn
            context: BankChurn-Predictor
            image: ml-portfolio/bankchurn
            manifest: k8s/overlays/aws/bankchurn-deployment-aws.yaml
          - service: nlpinsight
            context: NLPInsight-Analyzer
            image: ml-portfolio/nlpinsight
            manifest: k8s/overlays/aws/nlpinsight-deployment-aws.yaml
          - service: chicagotaxi
            context: ChicagoTaxi-Demand-Pipeline
            image: ml-portfolio/chicagotaxi
            manifest: k8s/overlays/aws/chicagotaxi-deployment-aws.yaml
    if: >
      needs.detect-changes.outputs.bankchurn == 'true' ||
      needs.detect-changes.outputs.nlpinsight == 'true' ||
      needs.detect-changes.outputs.chicagotaxi == 'true' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        run: |
          IMAGE="${{ env.ECR_REGISTRY }}/${{ matrix.image }}"
          TAG="sha-${GITHUB_SHA::8}"

          docker build \
            -t ${IMAGE}:${TAG} \
            -t ${IMAGE}:latest \
            ${{ matrix.context }}/

          docker push ${IMAGE}:${TAG}
          docker push ${IMAGE}:latest

          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Upload image tag artifact
        run: echo "${{ env.IMAGE_TAG }}" > tag.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-tag-aws-${{ matrix.service }}
          path: tag.txt

  # ---------------------------------------------------------------------------
  # Deploy to EKS
  # ---------------------------------------------------------------------------
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}-aws
      url: https://ml-aws.duqueom.com
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

      - name: Download image tag artifacts (if available)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: image-tag-aws-*
          merge-multiple: true
          path: /tmp/image-tags

      - name: Update image tags in AWS manifests
        run: |
          # Replace ACCOUNT_ID placeholder in all manifests first
          for FILE in k8s/overlays/aws/*-deployment-aws.yaml; do
            [ -f "$FILE" ] && sed -i "s|ACCOUNT_ID|${{ env.AWS_ACCOUNT_ID }}|g" "$FILE"
          done
          sed -i "s|ACCOUNT_ID|${{ env.AWS_ACCOUNT_ID }}|g" k8s/overlays/aws/serviceaccount-aws.yaml

          # Only update image tags if a new image was built in this workflow run.
          # If build-push was skipped (k8s/docs-only change), tag.txt won't exist
          # and we keep whatever image tag is already deployed — avoids stamping a
          # non-existent SHA onto the deployment manifest.
          if [ -f /tmp/image-tags/tag.txt ]; then
            TAG=$(cat /tmp/image-tags/tag.txt)
            echo "New image built: $TAG — updating deployment manifests"
            for FILE in k8s/overlays/aws/*-deployment-aws.yaml; do
              [ -f "$FILE" ] && sed -i "s|:latest|:${TAG}|g" "$FILE"
            done
          else
            echo "No new image built (build-push skipped) — keeping current deployed image tags"
            # Resolve :latest to the actual latest ECR tag to avoid tag mutation issues
            LATEST_BC=$(aws ecr describe-images --repository-name ml-portfolio/bankchurn \
              --region ${{ env.AWS_REGION }} \
              --query 'sort_by(imageDetails,&imagePushedAt)[-1].imageTags[0]' \
              --output text 2>/dev/null || echo 'latest')
            LATEST_NLP=$(aws ecr describe-images --repository-name ml-portfolio/nlpinsight \
              --region ${{ env.AWS_REGION }} \
              --query 'sort_by(imageDetails,&imagePushedAt)[-1].imageTags[0]' \
              --output text 2>/dev/null || echo 'latest')
            LATEST_CT=$(aws ecr describe-images --repository-name ml-portfolio/chicagotaxi \
              --region ${{ env.AWS_REGION }} \
              --query 'sort_by(imageDetails,&imagePushedAt)[-1].imageTags[0]' \
              --output text 2>/dev/null || echo 'latest')
            sed -i "s|:latest|:${LATEST_BC}|g" k8s/overlays/aws/bankchurn-deployment-aws.yaml
            sed -i "s|:latest|:${LATEST_NLP}|g" k8s/overlays/aws/nlpinsight-deployment-aws.yaml
            sed -i "s|:latest|:${LATEST_CT}|g" k8s/overlays/aws/chicagotaxi-deployment-aws.yaml
            echo "Pinned bankchurn → $LATEST_BC, nlpinsight → $LATEST_NLP, chicagotaxi → $LATEST_CT"
          fi

      - name: Apply Kubernetes manifests (AWS overlay)
        run: |
          # Ensure namespace exists
          kubectl apply -f k8s/base/namespace.yaml

          # Apply shared resources — PVCs are immutable after creation; only create if they don't exist
          PVC_COUNT=$(kubectl get pvc -n ml-portfolio --no-headers 2>/dev/null | wc -l)
          if [ "$PVC_COUNT" -eq 0 ]; then
            echo "Creating PVCs (fresh cluster)"
            kubectl apply -f k8s/base/storage.yaml
          else
            echo "PVCs already exist ($PVC_COUNT found) — skipping immutable spec update"
          fi

          # Apply AWS-specific overlay (ConfigMaps must be before deployments — init containers depend on them)
          kubectl apply -f k8s/overlays/aws/serviceaccount-aws.yaml
          kubectl apply -f k8s/overlays/aws/download-script-aws.yaml
          kubectl apply -f k8s/overlays/aws/model-configmaps-aws.yaml
          kubectl apply -f k8s/overlays/aws/dataset-configmaps-aws.yaml
          # Deploy ML services (AWS versions)
          kubectl apply -f k8s/overlays/aws/bankchurn-deployment-aws.yaml
          kubectl apply -f k8s/overlays/aws/nlpinsight-deployment-aws.yaml

          # Deploy monitoring (shared manifests)
          kubectl apply -f k8s/base/prometheus-deployment.yaml
          kubectl apply -f k8s/base/grafana-deployment.yaml

          # Deploy MLOps automation CronJobs
          kubectl apply -f k8s/base/drift-detection-cronjob.yaml
          kubectl apply -f k8s/base/drift-retraining-cronjob.yaml

          # Deploy ML services (chicagotaxi — AWS version)
          kubectl apply -f k8s/overlays/aws/chicagotaxi-deployment-aws.yaml

          # Apply AWS nginx ingress
          kubectl apply -f k8s/overlays/aws/ingress-aws.yaml

      - name: Wait for rollouts
        run: |
          echo "Waiting for deployments to be ready..."
          kubectl rollout status deployment/bankchurn-predictor -n ${{ env.NAMESPACE }} --timeout=300s || true
          kubectl rollout status deployment/nlpinsight-analyzer -n ${{ env.NAMESPACE }} --timeout=300s || true

      - name: Verify deployment
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n ${{ env.NAMESPACE }}

          echo ""
          echo "=== Services ==="
          kubectl get svc -n ${{ env.NAMESPACE }}

          echo ""
          echo "=== Ingress (ALB) ==="
          kubectl get ingress -n ${{ env.NAMESPACE }}

      - name: Smoke test health endpoints
        run: |
          for SVC in bankchurn-service nlpinsight-service chicagotaxi-service; do
            echo "Testing ${SVC}..."
            kubectl run health-test-${SVC} \
              --namespace=${{ env.NAMESPACE }} \
              --image=curlimages/curl:latest \
              --restart=Never \
              --rm -i --timeout=30s \
              -- curl -sf http://${SVC}/health || echo "WARNING: ${SVC} health check failed"
          done

  # ---------------------------------------------------------------------------
  # Post-deploy notification
  # ---------------------------------------------------------------------------
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "## AWS EKS Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${GITHUB_SHA::8}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${GITHUB_REF_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${GITHUB_EVENT_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cloud**: AWS (EKS)" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services" >> $GITHUB_STEP_SUMMARY
          echo "- BankChurn: via ALB" >> $GITHUB_STEP_SUMMARY
          echo "- NLPInsight: via ALB" >> $GITHUB_STEP_SUMMARY
          echo "- ChicagoTaxi: via ALB" >> $GITHUB_STEP_SUMMARY
