name: Dependabot auto-merge

# Merge low-risk dependency updates when CI is green; leave majors to a human.
#
# The gate is this branch's required checks, not this workflow: `--auto` queues
# the merge and GitHub performs it only once every required check has passed.
# `main` requires Tests & Coverage, Quality Gates, Security Scanning,
# Kubernetes Manifests and Build Documentation, so an update that breaks any
# of them stays open with the failure attached.
#
# Majors are never queued. ADR-005 of this repository exists because numpy 2.x
# silently corrupted joblib-serialised models with no error raised, and `~=`
# pinning is what blocks that class. A major asks whether such a boundary
# should move, which CI cannot answer.
on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Queue merge for non-major updates
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read Dependabot's metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Queue auto-merge (patch, minor, digest)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash "$PR_URL"
          echo "::notice::Auto-merge queued (${{ steps.metadata.outputs.update-type }}). GitHub merges it when every required check passes."

      - name: Leave majors for a human
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "::notice::Major update — not auto-merged. See ADR-005 (compatible release pinning): a major asks whether a boundary should move."
