name: Deploy to GKE

on:
  push:
    branches: [main]
    paths:
      - 'BankChurn-Predictor/**'
      - 'NLPInsight-Analyzer/**'
      - 'ChicagoTaxi-Demand-Pipeline/**'
      - 'k8s/**'
      - '.github/workflows/deploy-gcp.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (all, bankchurn, nlpinsight, chicagotaxi)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - bankchurn
          - nlpinsight
          - chicagotaxi
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER_NAME }}
  AR_REPO: ${{ secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ml-portfolio-images
  NAMESPACE: ml-portfolio

jobs:
  # ---------------------------------------------------------------------------
  # Detect which services changed (skip on manual dispatch)
  # ---------------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      bankchurn: ${{ steps.filter.outputs.bankchurn }}
      nlpinsight: ${{ steps.filter.outputs.nlpinsight }}
      chicagotaxi: ${{ steps.filter.outputs.chicagotaxi }}
      k8s: ${{ steps.filter.outputs.k8s }}
      has_creds: ${{ steps.creds.outputs.has_creds }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            bankchurn:
              - 'BankChurn-Predictor/**'
            nlpinsight:
              - 'NLPInsight-Analyzer/**'
            chicagotaxi:
              - 'ChicagoTaxi-Demand-Pipeline/**'
            k8s:
              - 'k8s/**'
      # Gate downstream jobs on GCP credentials being configured. The `secrets`
      # context cannot be used in job-level `if:`, so we surface it as an output.
      - name: Check for GCP credentials
        id: creds
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP credentials not configured — skipping GKE build & deploy."
          fi

  # ---------------------------------------------------------------------------
  # Build & Push Docker images to Artifact Registry
  # ---------------------------------------------------------------------------
  build-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: bankchurn
            context: BankChurn-Predictor
            image: bankchurn-predictor
            manifest: k8s/bankchurn-deployment.yaml
          - service: nlpinsight
            context: NLPInsight-Analyzer
            image: nlpinsight-analyzer
            manifest: k8s/nlpinsight-deployment.yaml
          - service: chicagotaxi
            context: ChicagoTaxi-Demand-Pipeline
            image: chicagotaxi
            manifest: k8s/chicagotaxi-deployment.yaml
    if: >
      needs.detect-changes.outputs.has_creds == 'true' &&
      (needs.detect-changes.outputs.bankchurn == 'true' ||
       needs.detect-changes.outputs.nlpinsight == 'true' ||
       needs.detect-changes.outputs.chicagotaxi == 'true' ||
       github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ env.AR_REPO }}/${{ matrix.image }}"
          TAG="sha-${GITHUB_SHA::8}"

          docker build \
            -t ${IMAGE}:${TAG} \
            -t ${IMAGE}:latest \
            ${{ matrix.context }}/

          docker push ${IMAGE}:${TAG}
          docker push ${IMAGE}:latest

          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Upload image tag artifact
        run: echo "${{ env.IMAGE_TAG }}" > tag.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-tag-${{ matrix.service }}
          path: tag.txt

  # ---------------------------------------------------------------------------
  # Deploy to GKE
  # ---------------------------------------------------------------------------
  deploy:
    needs: [detect-changes, build-push]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && needs.detect-changes.outputs.has_creds == 'true'
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}-gcp
      url: https://ml.duqueom.com
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Download image tag artifacts (if available)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: image-tag-*
          merge-multiple: true
          path: /tmp/image-tags

      - name: Update image tags in manifests
        run: |
          # Only update image tags if a new image was built in this workflow run.
          # If build-push was skipped (k8s/docs-only change), tag.txt won't exist
          # and we keep whatever image tag is already deployed — avoids stamping a
          # non-existent SHA onto the deployment manifest.
          if [ -f /tmp/image-tags/tag.txt ]; then
            TAG=$(cat /tmp/image-tags/tag.txt)
            echo "New image built: $TAG — updating deployment manifests"
            # Each service uses its full AR image name (must match what build-push built)
            sed -i "s|${{ env.AR_REPO }}/bankchurn-predictor:.*|${{ env.AR_REPO }}/bankchurn-predictor:${TAG}|g" k8s/overlays/gcp/bankchurn-deployment.yaml
            sed -i "s|${{ env.AR_REPO }}/nlpinsight-analyzer:.*|${{ env.AR_REPO }}/nlpinsight-analyzer:${TAG}|g" k8s/overlays/gcp/nlpinsight-deployment.yaml
            sed -i "s|${{ env.AR_REPO }}/chicagotaxi:.*|${{ env.AR_REPO }}/chicagotaxi:${TAG}|g" k8s/overlays/gcp/chicagotaxi-deployment.yaml
          else
            echo "No new image built (build-push skipped) — keeping current deployed image tags (latest)"
          fi

      - name: Apply Kubernetes manifests
        run: |
          # Ensure namespace exists
          kubectl apply -f k8s/base/namespace.yaml

          # Apply storage — PVCs are immutable after creation; only create if they don't exist
          PVC_COUNT=$(kubectl get pvc -n ml-portfolio --no-headers 2>/dev/null | wc -l)
          if [ "$PVC_COUNT" -eq 0 ]; then
            echo "Creating PVCs (fresh cluster)"
            kubectl apply -f k8s/base/storage.yaml
          else
            echo "PVCs already exist ($PVC_COUNT found) — skipping immutable spec update"
          fi
          kubectl get pvc -n ml-portfolio

          # Apply ConfigMaps (must be before deployments — init containers depend on them)
          kubectl apply -f k8s/overlays/gcp/download-script-gcp.yaml
          kubectl apply -f k8s/overlays/gcp/model-configmaps-gcp.yaml
          kubectl apply -f k8s/overlays/gcp/dataset-configmaps-gcp.yaml
          # Deploy ML services
          kubectl apply -f k8s/overlays/gcp/bankchurn-deployment.yaml
          kubectl apply -f k8s/overlays/gcp/nlpinsight-deployment.yaml
          kubectl apply -f k8s/overlays/gcp/chicagotaxi-deployment.yaml

          # Deploy monitoring
          kubectl apply -f k8s/base/prometheus-deployment.yaml
          kubectl apply -f k8s/base/grafana-deployment.yaml

          # Deploy MLOps automation CronJobs
          kubectl apply -f k8s/base/drift-detection-cronjob.yaml
          kubectl apply -f k8s/base/drift-retraining-cronjob.yaml

          # Enable nginx snippet annotations (required for ml-portfolio-monitoring-ingress
          # configuration-snippet that rewrites /mlflow/api/* → /api/* for SDK access).
          # Idempotent — safe to run on every deploy. ConfigMap is read dynamically; no restart.
          kubectl patch configmap ingress-nginx-controller -n ingress-nginx \
            --type=merge -p '{"data":{"allow-snippet-annotations":"true"}}' || true

          # Apply ingress
          kubectl apply -f k8s/overlays/gcp/ingress-gcp.yaml

      - name: Wait for rollouts
        run: |
          echo "Waiting for deployments to be ready..."
          kubectl rollout status deployment/bankchurn-predictor -n ${{ env.NAMESPACE }} --timeout=300s || true
          kubectl rollout status deployment/nlpinsight-analyzer -n ${{ env.NAMESPACE }} --timeout=300s || true
          kubectl rollout status deployment/chicagotaxi-pipeline -n ${{ env.NAMESPACE }} --timeout=300s || true

      - name: Verify deployment
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n ${{ env.NAMESPACE }}

          echo ""
          echo "=== Services ==="
          kubectl get svc -n ${{ env.NAMESPACE }}

          echo ""
          echo "=== Ingress ==="
          kubectl get ingress -n ${{ env.NAMESPACE }}

      - name: Smoke test health endpoints
        run: |
          # Get any running pod for port-forward tests
          for SVC in bankchurn-service nlpinsight-service chicagotaxi-service; do
            echo "Testing ${SVC}..."
            kubectl run health-test-${SVC} \
              --namespace=${{ env.NAMESPACE }} \
              --image=curlimages/curl:latest \
              --restart=Never \
              --rm -i --timeout=30s \
              -- curl -sf http://${SVC}/health || echo "WARNING: ${SVC} health check failed"
          done

  # ---------------------------------------------------------------------------
  # Post-deploy notification
  # ---------------------------------------------------------------------------
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "## GCP GKE Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${GITHUB_SHA::8}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${GITHUB_REF_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${GITHUB_EVENT_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cloud**: GCP (GKE)" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ env.GCP_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services" >> $GITHUB_STEP_SUMMARY
          echo "- BankChurn: via GKE Ingress (http://136.111.152.72/bankchurn/docs)" >> $GITHUB_STEP_SUMMARY
          echo "- NLPInsight: via GKE Ingress (http://136.111.152.72/nlpinsight/docs)" >> $GITHUB_STEP_SUMMARY
          echo "- ChicagoTaxi: via GKE Ingress (http://136.111.152.72/chicagotaxi/docs)" >> $GITHUB_STEP_SUMMARY
