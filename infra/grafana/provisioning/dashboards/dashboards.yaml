apiVersion: 1

providers:
  - name: 'ML Portfolio Dashboards'
    orgId: 1
    folder: 'ML/MLOps Portfolio'
    folderUid: 'ml-portfolio'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
