# Main configuration for BankChurn Predictor
# File: configs/config.yaml

# Data configuration
data:
  target_column: "Exited"
  drop_columns: 
    - "RowNumber"
    - "CustomerId" 
    - "Surname"
  
  categorical_features:
    - "Geography"
    - "Gender"
  
  numerical_features:
    - "CreditScore"
    - "Age"
    - "Tenure"
    - "Balance"
    - "NumOfProducts"
    - "HasCrCard"
    - "IsActiveMember"
    - "EstimatedSalary"

# Training configuration
training:
  test_size: 0.2
  validation_size: 0.2
  random_state: 42
  stratify: true
  
  # Cross-validation
  cv_folds: 5
  cv_shuffle: true
  
  # Evaluation metrics
  primary_metric: "f1"
  secondary_metrics:
    - "roc_auc"
    - "precision"
    - "recall"
    - "accuracy"

# Model configuration
model:
  # Primary model type: ensemble | xgboost | lightgbm | neural_network | random_forest | logistic_regression
  type: "ensemble"
  resampling_strategy: "none"  # oversample, undersample, none
  
  # Ensemble configuration
  ensemble:
    voting: "soft"
    weights: [0.4, 0.6]
  
  # Base model hyperparameters
  logistic_regression:
    C: 0.1
    class_weight: "balanced"
    solver: "liblinear"
    max_iter: 1000
  
  random_forest:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 10
    min_samples_leaf: 5
    class_weight: "balanced_subsample"

  # Advanced models configuration
  advanced:
    xgboost_params:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      scale_pos_weight: 3.9  # ~7963/2037 ratio
    lightgbm_params:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.05
      num_leaves: 31
      is_unbalance: true
    neural_network_params:
      hidden_dims: [128, 64, 32]
      lr: 0.001
      epochs: 100
      batch_size: 256
      dropout: 0.3
      early_stopping_patience: 10
      class_weight: "balanced"
    # Models to train and compare alongside the primary model
    compare_models:
      - "stacking"
      - "xgboost"
      - "lightgbm"
      - "neural_network"
      - "random_forest"

# Hyperparameter optimization configuration
hyperparameter_optimization:
  method: "optuna"  # optuna, randomized_search, grid_search
  n_trials: 100
  timeout: 3600  # seconds
  
  # Search space
  search_space:
    lr_C: [0.01, 10.0]  # log scale
    rf_n_estimators: [50, 200]
    rf_max_depth: [5, 20]
    rf_min_samples_split: [5, 20]
    ensemble_lr_weight: [0.1, 0.9]

# Preprocessing configuration
preprocessing:
  # Categorical encoding
  categorical_encoding:
    method: "onehot"
    drop_first: true
    handle_unknown: "ignore"
  
  # Numerical scaling
  numerical_scaling:
    method: "standard"  # standard, minmax, robust
  
  # Feature engineering (domain-driven features for churn prediction)
  feature_engineering:
    create_interactions: true
    create_ratios: true
    create_bins: true
    create_risk_scores: true

# Evaluation configuration
evaluation:
  # Classification metrics
  classification_metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"
    - "matthews_corrcoef"
  
  # Error analysis
  error_analysis:
    confusion_matrix: true
    classification_report: true
    feature_importance: true
  
  # Bootstrap confidence intervals
  bootstrap:
    n_iterations: 1000
    confidence_level: 0.95

# Logging configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  handlers:
    file:
      enabled: true
      filename: "logs/bankchurn.log"
      max_bytes: 10485760  # 10MB
      backup_count: 5
    
    console:
      enabled: true
      stream: "stdout"

# Paths configuration
paths:
  data:
    raw: "data/raw/"
    processed: "data/processed/"
  
  models:
    directory: "models/"
    filename: "models/model.joblib"
    preprocessor: "models/preprocessor.joblib"
  
  artifacts:
    directory: "artifacts/"
    metrics: "artifacts/metrics/"
    plots: "artifacts/plots/"
    training_results: "artifacts/training_results.json"

# API configuration
api:
  host: "0.0.0.0"
  port: 8000
  reload: false
  
  # Rate limiting
  rate_limits:
    requests_per_minute: 1000
    batch_size_limit: 1000
  
  # CORS configuration — use CORS_ORIGINS env var in production
  cors:
    allow_origins: ["http://localhost:3000", "http://localhost:8501"]
    allow_methods: ["GET", "POST"]
    allow_headers: ["Content-Type", "Authorization"]

# Deployment configuration
deployment:
  environment: "development"  # development, staging, production
  
  docker:
    image_name: "bankchurn-predictor"
    tag: "latest"
    port_mapping: "8000:8000"
  
  monitoring:
    health_check_interval: 30  # seconds
    metrics_collection: true
    log_predictions: false  # Development only

# Security configuration
security:
  api_key_required: false
  rate_limiting: true
  input_validation: true
  
  # Secrets should be managed via environment variables
  # Set these in your .env file (not committed to git):
  # - MODEL_ENCRYPTION_KEY
  # - API_SECRET_KEY

# MLflow configuration
mlflow:
  # To use Docker stack (docker-compose.mlflow.yml): http://localhost:5000
  # For local development without Docker: file:./mlruns
  tracking_uri: "file:./mlruns"
  experiment_name: "bankchurn-experiment"
  enabled: true
