[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bankchurn-predictor"
version = "1.0.0"
description = "Bank customer churn prediction with ensemble models and fairness analysis"
readme = "README.md"
requires-python = ">=3.13"
license = {file = "LICENSE"}
authors = [
    {name = "Duque Ortega Mutis (DuqueOM)", email = "DuqueOrtegaMutis@gmail.com"}
]
keywords = ["machine-learning", "churn-prediction", "classification", "mlops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# What the image installs and the service imports (ADR-019). This list is the
# ONLY declaration: requirements.in, requirements-prod.txt and the versions the
# Dockerfile used to install inline are gone, and uv.lock at the repo root pins
# the resolution. Compatible release throughout (ADR-005).
#
# scikit-learn ~= 1.7.2 is the version every published artifact was saved
# with (models/*.joblib record `_sklearn_version`); training was resolving 1.9
# and serving 1.8. The environment that trains must not be newer than the one
# that serves (ADR-005 amendment) — one lock makes them the same.
dependencies = [
    "pandas>=2.3,<3.2",
    "numpy>=2.4.6,<2.6.0",
    "scipy ~= 1.17.1",
    "scikit-learn ~= 1.7.2",
    "joblib ~= 1.6.0",
    # 0.46 (the old serving pin) fails to import under numpy 2.4 once
    # matplotlib is present — its vendored colour conversion calls
    # np.dtype(np.floating). The image had no matplotlib and CI resolved a newer
    # shap, so nothing ever ran the pin that served. 0.54 imports either way.
    "shap ~= 0.54.1",
    # xgboost-cpu: the same `xgboost` module without nvidia-nccl-cu12 (~290 MB
    # of GPU runtime). The Dockerfile used `pip install --no-deps` for this;
    # the CPU distribution says it in the declaration instead.
    "xgboost-cpu ~= 3.4.1",
    # lightgbm declares narwhals itself; the Dockerfile only added it by hand
    # because `--no-deps` dropped it.
    "lightgbm ~= 4.7.0",
    "fastapi ~= 0.162.0",
    "uvicorn ~= 0.53.0",
    "pydantic ~= 2.14.1",
    "python-multipart ~= 0.0.32",
    "pyyaml ~= 6.0.0",
    "prometheus-client ~= 0.26.0",
    "typing-extensions ~= 4.16.0",
]

# Not in the image. `uv sync --all-packages --all-groups` installs them for
# development and CI; the images install `--no-dev` and no groups.
[dependency-groups]
train = [
    "imbalanced-learn ~= 0.14.2",
    "optuna ~= 5.0.0",
    "mlflow ~= 3.16.1",
    "evidently ~= 0.7.23",
    "matplotlib ~= 3.11.2",
    "seaborn ~= 0.13.2",
    "plotly ~= 5.24.1",
    "tqdm ~= 4.70.1",
    "requests ~= 2.34.2",
]
notebook = [
    "jupyter ~= 1.1.1",
    "ipython ~= 9.17.1",
]

[tool.uv]
# Virtual member: run from source, never built (ADR-019). The entry point is
# `python main.py`; the unused `bankchurn = "main:main"` console script went
# with packaging (a virtual member never installs [project.scripts]).
package = false

[project.urls]
Homepage = "https://github.com/DuqueOM/ML-MLOps-Portfolio"
Repository = "https://github.com/DuqueOM/ML-MLOps-Portfolio"
Documentation = "https://github.com/DuqueOM/ML-MLOps-Portfolio/tree/main/BankChurn-Predictor"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | \.pytest_cache
  | \.mypy_cache
  | data
  | artifacts
  | mlruns
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true
extend_skip_glob = ["data/*", "artifacts/*", "mlruns/*"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src/bankchurn",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=79",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

[[tool.mypy.overrides]]
module = ["pandas.*", "numpy.*", "sklearn.*", "optuna.*", "mlflow.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/bankchurn"]
omit = [
    "tests/*",
    "test_*.py",
    ".venv/*",
    "venv/*",
    "setup.py",
    "data/validate_data.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
