stages:
  preprocess:
    cmd: python data/preprocess.py --input data/raw/Churn.csv --output data/processed/churn_processed.csv --config configs/config.yaml
    deps:
      - data/raw/Churn.csv
      - configs/config.yaml
      - data/preprocess.py
    outs:
      - data/processed/churn_processed.csv
  train:
    cmd: python main.py train --config configs/config.yaml --input data/processed/churn_processed.csv --model models/model.joblib --metrics-output artifacts/training_results.json
    deps:
      - data/processed/churn_processed.csv
      - main.py
      - src/bankchurn/training.py
      - src/bankchurn/config.py
      - configs/config.yaml
    outs:
      - models/model.joblib
      - artifacts/training_results.json
  evaluate:
    cmd: python main.py evaluate --config configs/config.yaml --input data/processed/churn_processed.csv --model models/model.joblib --output artifacts/evaluation_results.json
    deps:
      - models/model.joblib
      - data/processed/churn_processed.csv
      - main.py
      - src/bankchurn/evaluation.py
    outs:
      - artifacts/evaluation_results.json
