[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = True
ignore_missing_imports = True
show_error_codes = True
pretty = True

# Strict for common_utils (shared library)
[mypy-common_utils.*]
disallow_untyped_defs = True

# Strict for FastAPI apps (public API surface)
[mypy-app.fastapi_app]
disallow_untyped_defs = False
check_untyped_defs = True

# Ignore third-party stubs
[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-lightgbm.*]
ignore_missing_imports = True

[mypy-xgboost.*]
ignore_missing_imports = True

[mypy-shap.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-transformers.*]
ignore_missing_imports = True

[mypy-prometheus_client.*]
ignore_missing_imports = True

[mypy-evidently.*]
ignore_missing_imports = True

[mypy-pandera.*]
ignore_missing_imports = True

[mypy-streamlit.*]
ignore_missing_imports = True

[mypy-plotly.*]
ignore_missing_imports = True

[mypy-mlflow.*]
ignore_missing_imports = True
