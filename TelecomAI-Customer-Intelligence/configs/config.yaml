project_name: TelecomAI-Customer-Intelligence
random_seed: 42

paths:
  data_csv: data/raw/users_behavior.csv
  artifacts_dir: artifacts
  model_path: models/model.joblib
  preprocessor_path: models/preprocessor.joblib
  metrics_path: artifacts/metrics.json
  confusion_matrix_path: artifacts/confusion_matrix.png
  roc_curve_path: artifacts/roc_curve.png
  model_export_path: models/model.joblib

# Datos
features:
  - calls
  - minutes
  - messages
  - mb_used
target: is_ultra

split:
  test_size: 0.2
  stratify: true

model:
  # Primary model: gradient_boosting | xgboost | lightgbm | neural_network | random_forest | logistic_regression
  name: xgboost
  params:
    n_estimators: 200
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
  compare_models:
    - "gradient_boosting"
    - "lightgbm"
    - "random_forest"
    - "neural_network"

threshold: 0.5

mlflow:
  enable: true
  experiment: TelecomAI
  tracking_uri: file:./mlruns
