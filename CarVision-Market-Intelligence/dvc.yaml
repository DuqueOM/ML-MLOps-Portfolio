stages:
  preprocess:
    cmd: python data/preprocess.py --input data/raw/car_prices.csv --output data/processed/car_processed.csv --config configs/config.yaml
    deps:
      - data/raw/car_prices.csv
      - configs/config.yaml
      - data/preprocess.py
    outs:
      - data/processed/car_processed.csv
  train:
    cmd: python main.py --mode train --config configs/config.yaml --seed 42 --input data/processed/car_processed.csv
    deps:
      - data/processed/car_processed.csv
      - main.py
    outs:
      - models/model.joblib
      - artifacts/training_results.json
  evaluate:
    cmd: python main.py --mode evaluate --model models/model.joblib --config configs/config.yaml
    deps:
      - models/model.joblib
      - data/processed/car_processed.csv
      - main.py
    outs:
      - artifacts/metrics