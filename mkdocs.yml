site_name: Duque Ortega Mutis | MLOps & Production ML Portfolio
site_description: A Live-Site portfolio for entry-level MLOps, Production ML, and Applied AI roles.
site_author: Duque Ortega Mutis
site_url: https://duqueom.github.io/ML-MLOps-Portfolio/

repo_name: DuqueOM/ML-MLOps-Portfolio
repo_url: https://github.com/DuqueOM/ML-MLOps-Portfolio

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/portfolio.css

plugins:
  - search
  - mermaid2
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - About Me: about.md
  - Recruiter Brief: recruiter-brief.md
  - Projects:
      - Overview: projects/overview.md
      - BankChurn Predictor: projects/bankchurn.md
      - NLPInsight Analyzer: projects/nlpinsight.md
      - ChicagoTaxi Pipeline: projects/chicagotaxi.md
  - Production Template: template.md
  - Technical Evidence:
      - Evidence Overview: technical-evidence.md
      - Portfolio Status: PORTFOLIO_STATUS.md
      - Deep Dive Index: technical-deep-dive.md
  - Contact: contact.md

extra:
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/DuqueOM
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/duqueom

watch:
  - docs

copyright: Copyright &copy; 2024-2026 Duque Ortega Mutis
