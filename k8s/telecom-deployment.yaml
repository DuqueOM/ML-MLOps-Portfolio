apiVersion: apps/v1
kind: Deployment
metadata:
  name: telecom-intelligence
  namespace: ml-portfolio
  labels:
    app: telecom-intelligence
    tier: ml-service
    version: v2.0.0
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: telecom-intelligence
  template:
    metadata:
      labels:
        app: telecom-intelligence
        tier: ml-service
        version: v2.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ml-workload
      containers:
      - name: telecom-api
        image: us-central1-docker.pkg.dev/ml-portfolio-duque-om-202602/ml-portfolio-images/telecomai-customer-intelligence:latest
        imagePullPolicy: Always
        command: ["uvicorn", "app.fastapi_app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: MODEL_PATH
          value: "/app/models/model.joblib"
        - name: ARTIFACTS_DIR
          value: "/app/artifacts"
        - name: PYTHONUNBUFFERED
          value: "1"
        envFrom:
        - configMapRef:
            name: telecom-config
        resources:
          requests:
            memory: "384Mi"
            cpu: "200m"
          limits:
            memory: "768Mi"
            cpu: "800m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: models
          mountPath: /app/models
      initContainers:
      - name: download-model
        image: python:3.11-alpine
        command:
        - sh
        - -c
        - |
          pip install --quiet google-cloud-storage==2.18.2 && \
          python /scripts/download-model.py
        envFrom:
        - configMapRef:
            name: telecom-model-config
        volumeMounts:
        - name: models
          mountPath: /models
        - name: download-script
          mountPath: /scripts
      volumes:
      - name: models
        emptyDir: {}
      - name: download-script
        configMap:
          name: download-script
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: telecom-service
  namespace: ml-portfolio
  labels:
    app: telecom-intelligence
spec:
  type: NodePort
  selector:
    app: telecom-intelligence
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: telecom-config
  namespace: ml-portfolio
data:
  MODEL_VERSION: "v2.0.0"
  FEATURE_VERSION: "v1"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: telecom-hpa
  namespace: ml-portfolio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: telecom-intelligence
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
