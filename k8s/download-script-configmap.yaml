# ConfigMap that holds the download-model.py script.
# Mounted into Init Containers at /scripts/download-model.py
# This avoids baking the script into a custom Docker image.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: download-script
  namespace: ml-portfolio
  labels:
    component: model-download
data:
  download-model.py: |
    #!/usr/bin/env python3
    """Download ML model from Google Cloud Storage with retry."""
    import os, sys, time

    MAX_RETRIES = 3
    RETRY_DELAY_SECONDS = 10

    def download_model():
        bucket_name = os.environ.get("GCS_BUCKET")
        blob_path = os.environ.get("GCS_MODEL_PATH")
        local_path = os.environ.get("LOCAL_MODEL_PATH", "/models/model.joblib")

        if not bucket_name or not blob_path:
            print("ERROR: GCS_BUCKET and GCS_MODEL_PATH are required")
            sys.exit(1)

        print(f"Downloading gs://{bucket_name}/{blob_path} -> {local_path}")
        os.makedirs(os.path.dirname(local_path), exist_ok=True)

        from google.cloud import storage
        client = storage.Client()
        bucket = client.bucket(bucket_name)
        blob = bucket.blob(blob_path)

        for attempt in range(1, MAX_RETRIES + 1):
            try:
                blob.download_to_filename(local_path)
                size_mb = os.path.getsize(local_path) / (1024 * 1024)
                print(f"OK: Downloaded {size_mb:.2f} MB (attempt {attempt}/{MAX_RETRIES})")
                sys.exit(0)
            except Exception as e:
                print(f"WARN: Attempt {attempt}/{MAX_RETRIES} failed: {e}")
                if attempt < MAX_RETRIES:
                    print(f"Retrying in {RETRY_DELAY_SECONDS}s...")
                    time.sleep(RETRY_DELAY_SECONDS)

        print("ERROR: All download attempts failed")
        sys.exit(1)

    if __name__ == "__main__":
        download_model()
