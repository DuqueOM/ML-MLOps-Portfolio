apiVersion: apps/v1
kind: Deployment
metadata:
  name: chicagotaxi-pipeline
  namespace: ml-portfolio
  labels:
    app: chicagotaxi-pipeline
    tier: ml-service
    version: v3.5.1
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: chicagotaxi-pipeline
  template:
    metadata:
      labels:
        app: chicagotaxi-pipeline
        tier: ml-service
        version: v3.5.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ml-workload
      initContainers:
      - name: model-download
        image: python:3.11-alpine
        command:
        - sh
        - -c
        - |
          pip install --quiet google-cloud-storage==2.18.2 && \
          python /scripts/download-model.py
        volumeMounts:
        - name: model-volume
          mountPath: /models
        - name: download-script
          mountPath: /scripts
        envFrom:
        - configMapRef:
            name: chicagotaxi-model-config
      - name: download-predictions
        image: python:3.11-alpine
        command:
        - sh
        - -c
        - |
          pip install --quiet google-cloud-storage==2.18.2 && \
          python /scripts/download-model.py
        volumeMounts:
        - name: predictions-volume
          mountPath: /data
        - name: download-script
          mountPath: /scripts
        envFrom:
        - configMapRef:
            name: chicagotaxi-predictions-config
      containers:
      - name: chicagotaxi-api
        image: us-central1-docker.pkg.dev/ml-portfolio-duque-om-202602/ml-portfolio-images/chicagotaxi:v3.5.1
        imagePullPolicy: Always
        command: ["uvicorn", "app.fastapi_app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: MODEL_PATH
          value: "/app/models/model.joblib"
        - name: PREDICTIONS_PATH
          value: "/app/data/processed/taxi_predictions"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: LOG_LEVEL
          value: "INFO"
        - name: LOG_FORMAT
          value: "json"
        - name: SERVICE_NAME
          value: "chicagotaxi"
        - name: API_ROOT_PATH
          value: "/chicagotaxi"
        envFrom:
        - configMapRef:
            name: chicagotaxi-config
            optional: true
        - secretRef:
            name: chicagotaxi-secrets
            optional: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: model-volume
          mountPath: /app/models
          readOnly: true
        - name: predictions-volume
          mountPath: /app/data/processed/taxi_predictions
          readOnly: true
      volumes:
      - name: model-volume
        emptyDir: {}
      - name: predictions-volume
        emptyDir: {}
      - name: download-script
        configMap:
          name: download-script
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: chicagotaxi-service
  namespace: ml-portfolio
  labels:
    app: chicagotaxi-pipeline
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: chicagotaxi-pipeline
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chicagotaxi-hpa
  namespace: ml-portfolio
  labels:
    app: chicagotaxi-pipeline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chicagotaxi-pipeline
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
