apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ml-portfolio
  labels:
    app: grafana
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        component: monitoring
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
      - name: grafana
        image: grafana/grafana:10.2.2
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: grafana-credentials
              key: admin-user
              optional: true
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-credentials
              key: admin-password
              optional: true
        - name: GF_INSTALL_PLUGINS
          value: "grafana-piechart-panel"
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboards-config
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 5
      volumes:
      - name: grafana-data
        emptyDir: {}
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboards-config
        configMap:
          name: grafana-dashboards-config
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: ml-portfolio
  labels:
    app: grafana
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: ml-portfolio
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus-service:9090
      isDefault: true
      editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: ml-portfolio
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: ml-portfolio
data:
  ml-portfolio-metrics.json: |
    {
      "id": null,
      "uid": "ml-portfolio",
      "title": "ML Portfolio Metrics",
      "tags": ["ml", "production"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Prediction Rate — All Services (req/s)",
          "description": "Predictions per second across all ML services",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "color": { "mode": "palette-classic" } },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(rate(bankchurn_requests_total[5m]))", "legendFormat": "BankChurn", "refId": "A" },
            { "expr": "sum(rate(carvision_requests_total[5m]))", "legendFormat": "CarVision", "refId": "B" },
            { "expr": "sum(rate(nlpinsight_requests_total[5m]))", "legendFormat": "NLPInsight", "refId": "C" }
          ]
        },
        {
          "id": 2,
          "title": "Latency P95 — All Services",
          "description": "95th percentile request duration per service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": { "mode": "palette-classic" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.2 },
                  { "color": "red", "value": 1.0 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(bankchurn_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "BankChurn P95", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum(rate(carvision_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "CarVision P95", "refId": "B" },
            { "expr": "histogram_quantile(0.95, sum(rate(nlpinsight_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "NLPInsight P95", "refId": "C" }
          ]
        },
        {
          "id": 3,
          "title": "Total Requests — BankChurn",
          "description": "Cumulative requests to BankChurn",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }, { "color": "green", "value": 100 }] } }, "overrides": [] },
          "targets": [
            { "expr": "sum(bankchurn_requests_total)", "legendFormat": "BankChurn", "refId": "A" }
          ]
        },
        {
          "id": 4,
          "title": "Total Requests — CarVision",
          "description": "Cumulative requests to CarVision",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }, { "color": "green", "value": 100 }] } }, "overrides": [] },
          "targets": [
            { "expr": "sum(carvision_requests_total)", "legendFormat": "CarVision", "refId": "A" }
          ]
        },
        {
          "id": 5,
          "title": "Total Requests — NLPInsight",
          "description": "Cumulative requests to NLPInsight",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }, { "color": "green", "value": 100 }] } }, "overrides": [] },
          "targets": [
            { "expr": "sum(nlpinsight_requests_total)", "legendFormat": "NLPInsight", "refId": "A" }
          ]
        },
        {
          "id": 6,
          "title": "Prometheus Targets UP",
          "description": "Number of scrape targets in UP state",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 3 }] } }, "overrides": [] },
          "targets": [
            { "expr": "count(up == 1)", "legendFormat": "Targets UP", "refId": "A" }
          ]
        },
        {
          "id": 7,
          "title": "Avg Latency — All Services",
          "description": "Average request duration per service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": { "unit": "s", "color": { "mode": "palette-classic" } },
            "overrides": []
          },
          "targets": [
            { "expr": "rate(bankchurn_request_duration_seconds_sum[5m]) / rate(bankchurn_request_duration_seconds_count[5m])", "legendFormat": "BankChurn Avg", "refId": "A" },
            { "expr": "rate(carvision_request_duration_seconds_sum[5m]) / rate(carvision_request_duration_seconds_count[5m])", "legendFormat": "CarVision Avg", "refId": "B" },
            { "expr": "rate(nlpinsight_request_duration_seconds_sum[5m]) / rate(nlpinsight_request_duration_seconds_count[5m])", "legendFormat": "NLPInsight Avg", "refId": "C" }
          ]
        },
        {
          "id": 8,
          "title": "Latency Distribution P99/P95/P50 — All Services",
          "description": "Request duration percentiles across all services",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": { "unit": "s", "color": { "mode": "palette-classic" } },
            "overrides": []
          },
          "targets": [
            { "expr": "histogram_quantile(0.99, sum(rate(bankchurn_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "BankChurn P99", "refId": "A" },
            { "expr": "histogram_quantile(0.99, sum(rate(carvision_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "CarVision P99", "refId": "B" },
            { "expr": "histogram_quantile(0.99, sum(rate(nlpinsight_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "NLPInsight P99", "refId": "C" },
            { "expr": "histogram_quantile(0.50, sum(rate(bankchurn_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "BankChurn P50", "refId": "D" },
            { "expr": "histogram_quantile(0.50, sum(rate(carvision_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "CarVision P50", "refId": "E" },
            { "expr": "histogram_quantile(0.50, sum(rate(nlpinsight_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "NLPInsight P50", "refId": "F" }
          ]
        },
        {
          "id": 9,
          "title": "BankChurn — Predictions by Risk Level",
          "description": "Churn predictions broken down by risk level",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" } },
            "overrides": []
          },
          "targets": [
            { "expr": "bankchurn_predictions_total{risk_level=\"HIGH\"}", "legendFormat": "HIGH risk", "refId": "A" },
            { "expr": "bankchurn_predictions_total{risk_level=\"MEDIUM\"}", "legendFormat": "MEDIUM risk", "refId": "B" },
            { "expr": "bankchurn_predictions_total{risk_level=\"LOW\"}", "legendFormat": "LOW risk", "refId": "C" }
          ]
        },
        {
          "id": 10,
          "title": "Error Rate — All Services",
          "description": "HTTP 5xx error rate per service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "color": { "mode": "palette-classic" }, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0.01 }] } },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(rate(bankchurn_requests_total{status=~\"5..\"}[5m]))", "legendFormat": "BankChurn errors", "refId": "A" },
            { "expr": "sum(rate(carvision_requests_total{status=~\"5..\"}[5m]))", "legendFormat": "CarVision errors", "refId": "B" },
            { "expr": "sum(rate(nlpinsight_requests_total{status=~\"5..\"}[5m]))", "legendFormat": "NLPInsight errors", "refId": "C" }
          ]
        }
      ],
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "Prometheus", "value": "Prometheus" },
            "hide": 2
          }
        ]
      }
    }
