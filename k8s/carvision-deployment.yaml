apiVersion: apps/v1
kind: Deployment
metadata:
  name: carvision-intelligence
  namespace: ml-portfolio
  labels:
    app: carvision-intelligence
    tier: ml-service
    version: v3.0.0
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: carvision-intelligence
  template:
    metadata:
      labels:
        app: carvision-intelligence
        tier: ml-service
        version: v3.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: ml-workload
      containers:
      - name: carvision-api
        image: us-central1-docker.pkg.dev/ml-portfolio-duque-om-202602/ml-portfolio-images/carvision-market-intelligence:latest
        imagePullPolicy: Always
        command: ["uvicorn", "app.fastapi_app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: MODEL_PATH
          value: "/app/models/model.joblib"
        - name: PYTHONUNBUFFERED
          value: "1"
        envFrom:
        - configMapRef:
            name: carvision-config
        resources:
          requests:
            memory: "768Mi"
            cpu: "300m"
          limits:
            memory: "1536Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: models
          mountPath: /app/models
        - name: data
          mountPath: /app/data
      # NOTE: Streamlit dashboard sidecar removed — production image uses
      # requirements-prod.txt which excludes streamlit for size optimization.
      # Use docker-compose.demo.yml for local Streamlit dashboard development.
      initContainers:
      - name: download-model
        image: python:3.11-alpine
        command:
        - sh
        - -c
        - |
          pip install --quiet google-cloud-storage==2.18.2 && \
          python /scripts/download-model.py
        envFrom:
        - configMapRef:
            name: carvision-model-config
        volumeMounts:
        - name: models
          mountPath: /models
        - name: download-script
          mountPath: /scripts
      - name: download-data
        image: python:3.11-alpine
        command:
        - sh
        - -c
        - |
          pip install --quiet google-cloud-storage==2.18.2 && \
          python /scripts/download-model.py
        envFrom:
        - configMapRef:
            name: carvision-dataset-config
        volumeMounts:
        - name: data
          mountPath: /data
        - name: download-script
          mountPath: /scripts
      - name: download-metrics
        image: python:3.11-alpine
        command:
        - sh
        - -c
        - |
          pip install --quiet google-cloud-storage==2.18.2 && \
          python -c "
          import os
          from google.cloud import storage
          bucket = storage.Client().bucket(os.environ['GCS_BUCKET'])
          for line in os.environ['ARTIFACTS'].strip().split('\n'):
              line = line.strip()
              if not line: continue
              gcs_path, local_path = line.split(':')
              os.makedirs(os.path.dirname(local_path), exist_ok=True)
              bucket.blob(gcs_path).download_to_filename(local_path)
              print(f'Downloaded {gcs_path} -> {local_path} ({os.path.getsize(local_path)} bytes)')
          "
        env:
        - name: GCS_BUCKET
          valueFrom:
            configMapKeyRef:
              name: carvision-metrics-config
              key: GCS_BUCKET
        - name: ARTIFACTS
          valueFrom:
            configMapKeyRef:
              name: carvision-metrics-config
              key: ARTIFACTS
        volumeMounts:
        - name: artifacts
          mountPath: /artifacts
      volumes:
      - name: models
        emptyDir: {}
      - name: data
        emptyDir: {}
      - name: artifacts
        emptyDir: {}
      - name: download-script
        configMap:
          name: download-script
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: carvision-service
  namespace: ml-portfolio
  labels:
    app: carvision-intelligence
spec:
  type: NodePort
  selector:
    app: carvision-intelligence
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  - name: streamlit
    port: 8501
    targetPort: 8501
    protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: carvision-config
  namespace: ml-portfolio
data:
  MODEL_VERSION: "v3.0.0"
  PREDICTIONS_PER_BATCH: "100"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: carvision-hpa
  namespace: ml-portfolio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: carvision-intelligence
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
