apiVersion: apps/v1
kind: Deployment
metadata:
  name: carvision-intelligence
  namespace: ml-portfolio
  labels:
    app: carvision-intelligence
    tier: ml-service
    version: v2.0.0
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: carvision-intelligence
  template:
    metadata:
      labels:
        app: carvision-intelligence
        tier: ml-service
        version: v2.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
      - name: carvision-api
        image: us-central1-docker.pkg.dev/ml-portfolio-duque-om-202602/ml-portfolio-images/carvision-market-intelligence:latest
        imagePullPolicy: Always
        command: ["uvicorn", "app.fastapi_app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: MODEL_PATH
          value: "/app/models/model.joblib"
        - name: PYTHONUNBUFFERED
          value: "1"
        envFrom:
        - configMapRef:
            name: carvision-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: models
          mountPath: /app/models
      initContainers:
      - name: download-model
        image: python:3.11-alpine
        command:
        - sh
        - -c
        - |
          pip install --quiet google-cloud-storage==2.18.2 && \
          python /scripts/download-model.py
        envFrom:
        - configMapRef:
            name: carvision-model-config
        volumeMounts:
        - name: models
          mountPath: /models
        - name: download-script
          mountPath: /scripts
      volumes:
      - name: models
        emptyDir: {}
      - name: download-script
        configMap:
          name: download-script
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: carvision-service
  namespace: ml-portfolio
  labels:
    app: carvision-intelligence
spec:
  type: NodePort
  selector:
    app: carvision-intelligence
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: carvision-config
  namespace: ml-portfolio
data:
  MODEL_VERSION: "v2.0.0"
  PREDICTIONS_PER_BATCH: "100"
