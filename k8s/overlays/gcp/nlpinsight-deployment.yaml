apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlpinsight-analyzer
  namespace: ml-portfolio
  labels:
    app: nlpinsight-analyzer
    tier: ml-service
    version: v3.6.0
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nlpinsight-analyzer
  template:
    metadata:
      labels:
        app: nlpinsight-analyzer
        tier: ml-service
        version: v3.6.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ml-workload
      containers:
      - name: nlpinsight-api
        image: us-central1-docker.pkg.dev/ml-portfolio-duque-om-202602/ml-portfolio-images/nlpinsight-analyzer:latest
        imagePullPolicy: Always
        command: ["uvicorn", "app.fastapi_app:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: MODEL_PATH
          value: "/app/models"
        - name: ARTIFACTS_DIR
          value: "/app/artifacts"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: LOG_LEVEL
          value: "INFO"
        - name: LOG_FORMAT
          value: "json"
        - name: SERVICE_NAME
          value: "nlpinsight"
        - name: API_ROOT_PATH
          value: "/nlpinsight"
        envFrom:
        - configMapRef:
            name: nlpinsight-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "300m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: models
          mountPath: /app/models
        - name: data
          mountPath: /app/data
      initContainers:
      - name: download-model
        image: python:3.11-alpine
        command:
        - sh
        - -c
        - |
          pip install --quiet google-cloud-storage==2.18.2 && \
          python /scripts/download-model.py
        envFrom:
        - configMapRef:
            name: nlpinsight-model-config
        volumeMounts:
        - name: models
          mountPath: /models
        - name: download-script
          mountPath: /scripts
      - name: download-data
        image: python:3.11-alpine
        command:
        - sh
        - -c
        - |
          pip install --quiet google-cloud-storage==2.18.2 && \
          python /scripts/download-model.py
        envFrom:
        - configMapRef:
            name: nlpinsight-dataset-config
        volumeMounts:
        - name: data
          mountPath: /data
        - name: download-script
          mountPath: /scripts
      volumes:
      - name: models
        emptyDir: {}
      - name: data
        emptyDir: {}
      - name: download-script
        configMap:
          name: download-script
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: nlpinsight-service
  namespace: ml-portfolio
  labels:
    app: nlpinsight-analyzer
spec:
  type: ClusterIP
  selector:
    app: nlpinsight-analyzer
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nlpinsight-config
  namespace: ml-portfolio
data:
  MODEL_VERSION: "v3.0.0"
  FEATURE_VERSION: "v1"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nlpinsight-hpa
  namespace: ml-portfolio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nlpinsight-analyzer
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
