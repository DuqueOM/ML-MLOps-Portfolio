apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankchurn-predictor
  namespace: ml-portfolio
  labels:
    app: bankchurn-predictor
    tier: ml-service
    version: v3.5.0
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: bankchurn-predictor
  template:
    metadata:
      labels:
        app: bankchurn-predictor
        tier: ml-service
        version: v3.5.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ml-workload
      containers:
      - name: bankchurn-api
        image: us-central1-docker.pkg.dev/ml-portfolio-duque-om-202602/ml-portfolio-images/bankchurn:v3.5.0
        imagePullPolicy: Always
        command: ["uvicorn", "app.fastapi_app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: MODEL_PATH
          value: "/app/models/model.joblib"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: LOG_LEVEL
          value: "INFO"
        - name: LOG_FORMAT
          value: "json"
        - name: SERVICE_NAME
          value: "bankchurn"
        - name: API_ROOT_PATH
          value: "/bankchurn"
        envFrom:
        - configMapRef:
            name: bankchurn-config
        - secretRef:
            name: bankchurn-secrets
            optional: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "300m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: models
          mountPath: /app/models
        - name: data
          mountPath: /app/data
        - name: logs
          mountPath: /app/logs
      initContainers:
      - name: download-model
        image: python:3.11-alpine
        command:
        - sh
        - -c
        - |
          pip install --quiet google-cloud-storage==2.18.2 && \
          python /scripts/download-model.py
        envFrom:
        - configMapRef:
            name: bankchurn-model-config
        volumeMounts:
        - name: models
          mountPath: /models
        - name: download-script
          mountPath: /scripts
      - name: download-data
        image: python:3.11-alpine
        command:
        - sh
        - -c
        - |
          pip install --quiet google-cloud-storage==2.18.2 && \
          python /scripts/download-model.py
        envFrom:
        - configMapRef:
            name: bankchurn-dataset-config
        volumeMounts:
        - name: data
          mountPath: /data
        - name: download-script
          mountPath: /scripts
      volumes:
      - name: models
        emptyDir: {}
      - name: data
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: download-script
        configMap:
          name: download-script
          defaultMode: 0755
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - bankchurn-predictor
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: bankchurn-service
  namespace: ml-portfolio
  labels:
    app: bankchurn-predictor
spec:
  type: ClusterIP
  selector:
    app: bankchurn-predictor
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bankchurn-config
  namespace: ml-portfolio
data:
  MODEL_VERSION: "v3.0.0"
  DRIFT_THRESHOLD: "0.05"
  MONITORING_ENABLED: "true"
  MLFLOW_TRACKING_URI: "http://mlflow-service:5000"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bankchurn-hpa
  namespace: ml-portfolio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bankchurn-predictor
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
