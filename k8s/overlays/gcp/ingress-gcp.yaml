# Ingress 1: ML API services — rewrite-target strips prefix so FastAPI receives requests at /
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ml-portfolio-ingress
  namespace: ml-portfolio
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /bankchurn(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: bankchurn-service
            port:
              number: 80
      - path: /nlpinsight(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: nlpinsight-service
            port:
              number: 80
      - path: /chicagotaxi(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: chicagotaxi-service
            port:
              number: 80
---
# Ingress 2: Monitoring tools — NO rewrite-target; both tools are configured to serve from sub-paths.
# Grafana: GF_SERVER_SERVE_FROM_SUB_PATH=true + GF_SERVER_ROOT_URL handles /grafana prefix.
# MLflow: --static-prefix /mlflow flag handles /mlflow prefix (added in v3.5.2).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ml-portfolio-monitoring-ingress
  namespace: ml-portfolio
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: grafana-service
            port:
              number: 3000
      - path: /mlflow
        pathType: Prefix
        backend:
          service:
            name: mlflow-service
            port:
              number: 5000
