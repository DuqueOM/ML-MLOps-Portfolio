# AWS Service Account with IRSA (IAM Roles for Service Accounts)
# Equivalent to k8s/ml-workload-serviceaccount.yaml (GCP Workload Identity)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-workload
  namespace: ml-portfolio
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::531948420830:role/ml-portfolio-eks-workload-role
  labels:
    app.kubernetes.io/part-of: ml-portfolio
    app.kubernetes.io/managed-by: kustomize
imagePullSecrets:
- name: ecr-credentials
