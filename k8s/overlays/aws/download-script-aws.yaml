# ConfigMap: S3 model download script for AWS EKS
# Equivalent to k8s/download-script-configmap.yaml (GCS version for GCP)
# Mounted into Init Containers at /scripts/download-model.py
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: download-script
  namespace: ml-portfolio
  labels:
    component: model-download
    cloud: aws
data:
  download-model.py: |
    #!/usr/bin/env python3
    """Download ML model from Amazon S3 with retry."""
    import os, sys, time

    MAX_RETRIES = 3
    RETRY_DELAY_SECONDS = 10

    def download_model():
        bucket_name = os.environ.get("S3_BUCKET")
        object_key = os.environ.get("S3_MODEL_PATH")
        local_path = os.environ.get("LOCAL_MODEL_PATH", "/models/model.joblib")

        if not bucket_name or not object_key:
            print("ERROR: S3_BUCKET and S3_MODEL_PATH are required")
            sys.exit(1)

        print(f"Downloading s3://{bucket_name}/{object_key} -> {local_path}")
        os.makedirs(os.path.dirname(local_path), exist_ok=True)

        import boto3
        s3 = boto3.client("s3")

        for attempt in range(1, MAX_RETRIES + 1):
            try:
                s3.download_file(bucket_name, object_key, local_path)
                size_mb = os.path.getsize(local_path) / (1024 * 1024)
                print(f"OK: Downloaded {size_mb:.2f} MB (attempt {attempt}/{MAX_RETRIES})")
                sys.exit(0)
            except Exception as e:
                print(f"WARN: Attempt {attempt}/{MAX_RETRIES} failed: {e}")
                if attempt < MAX_RETRIES:
                    print(f"Retrying in {RETRY_DELAY_SECONDS}s...")
                    time.sleep(RETRY_DELAY_SECONDS)

        print("ERROR: All download attempts failed")
        sys.exit(1)

    if __name__ == "__main__":
        download_model()
