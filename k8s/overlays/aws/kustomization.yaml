# AWS Overlay — EKS-specific resources layered on top of cloud-agnostic base
# Usage: kubectl apply -k k8s/overlays/aws/
# Auth: IRSA (IAM Roles for Service Accounts) — see serviceaccount-aws.yaml
# Storage: S3 (boto3 in init containers) — see download-script-aws.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ml-portfolio

resources:
  - ../../base
  # Cloud-specific: EKS auth, S3 download script, ALB/nginx ingress
  - serviceaccount-aws.yaml
  - download-script-aws.yaml
  - ingress-aws.yaml
  # Cloud-specific: S3 bucket paths for model/dataset downloads
  - model-configmaps-aws.yaml
  - dataset-configmaps-aws.yaml
  # ML service deployments (ECR images, boto3 init containers)
  - bankchurn-deployment-aws.yaml
  - nlpinsight-deployment-aws.yaml
  - chicagotaxi-deployment-aws.yaml

patches:
  - path: grafana-domain-patch.yaml
