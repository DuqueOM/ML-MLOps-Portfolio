# ConfigMaps for S3 dataset download paths (AWS).
# Equivalent to k8s/dataset-configmaps.yaml (GCS version for GCP)
# Each project has its own ConfigMap pointing to the versioned dataset in S3.
# Bucket: ml-portfolio-datasets-production
# Naming convention: {project}/v{version}/{filename}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bankchurn-dataset-config
  namespace: ml-portfolio
  labels:
    app: bankchurn-predictor
    component: dataset-download
    cloud: aws
data:
  S3_BUCKET: "ml-portfolio-datasets-production"
  S3_MODEL_PATH: "bankchurn/v1/Churn.csv"
  LOCAL_MODEL_PATH: "/data/raw/Churn.csv"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nlpinsight-dataset-config
  namespace: ml-portfolio
  labels:
    app: nlpinsight-analyzer
    component: dataset-download
    cloud: aws
data:
  S3_BUCKET: "ml-portfolio-datasets-production"
  S3_MODEL_PATH: "nlpinsight/v1/financial_phrasebank.csv"
  LOCAL_MODEL_PATH: "/data/raw/train.csv"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chicagotaxi-predictions-config
  namespace: ml-portfolio
  labels:
    app: chicagotaxi-pipeline
    component: dataset-download
    cloud: aws
data:
  S3_BUCKET: "ml-portfolio-ml-models-production"
  S3_MODEL_PATH: "chicagotaxi/predictions.parquet"
  LOCAL_MODEL_PATH: "/data/predictions.parquet"
