apiVersion: batch/v1
kind: CronJob
metadata:
  name: drift-retraining-trigger
  namespace: ml-portfolio
  labels:
    app: drift-retraining-trigger
    component: mlops-automation
spec:
  schedule: "0 2 * * *"  # Daily at 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: drift-retraining-trigger
        spec:
          restartPolicy: Never
          serviceAccountName: ml-portfolio-sa
          containers:
            - name: drift-checker
              image: python:3.11-slim
              env:
                - name: PROMETHEUS_URL
                  value: "http://prometheus-service:9090"
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: github-retraining-token
                      key: token
                - name: GITHUB_REPO
                  value: "DuqueOM/ML-MLOps-Portfolio"
                - name: GITHUB_WORKFLOW
                  value: "cml-training-comparison.yml"
                # Drift thresholds — tune per model
                - name: PSI_CRITICAL_THRESHOLD
                  value: "0.20"
                - name: PSI_WARNING_THRESHOLD
                  value: "0.10"
                - name: AUC_DEGRADATION_THRESHOLD
                  value: "0.75"
                - name: RMSE_CRITICAL_THRESHOLD
                  value: "10000"
                - name: F1_MACRO_DEGRADATION_THRESHOLD
                  value: "0.80"
              command:
                - python
                - -c
                - |
                  import os
                  import json
                  import urllib.request
                  import urllib.parse
                  import sys

                  PROMETHEUS_URL = os.environ["PROMETHEUS_URL"]
                  GITHUB_TOKEN = os.environ["GITHUB_TOKEN"]
                  GITHUB_REPO = os.environ["GITHUB_REPO"]
                  GITHUB_WORKFLOW = os.environ["GITHUB_WORKFLOW"]
                  PSI_CRITICAL = float(os.environ["PSI_CRITICAL_THRESHOLD"])
                  AUC_FLOOR = float(os.environ["AUC_DEGRADATION_THRESHOLD"])
                  RMSE_CEILING = float(os.environ["RMSE_CRITICAL_THRESHOLD"])
                  F1_FLOOR = float(os.environ["F1_MACRO_DEGRADATION_THRESHOLD"])

                  def query_prometheus(promql):
                      """Query Prometheus instant API and return scalar or None."""
                      url = f"{PROMETHEUS_URL}/api/v1/query?" + urllib.parse.urlencode({"query": promql})
                      try:
                          with urllib.request.urlopen(url, timeout=10) as resp:
                              data = json.loads(resp.read())
                          results = data.get("data", {}).get("result", [])
                          if results:
                              return float(results[0]["value"][1])
                      except Exception as e:
                          print(f"[WARN] Prometheus query failed ({promql}): {e}")
                      return None

                  def trigger_retraining(model, reason):
                      """Dispatch a GitHub Actions workflow_dispatch event."""
                      url = f"https://api.github.com/repos/{GITHUB_REPO}/actions/workflows/{GITHUB_WORKFLOW}/dispatches"
                      payload = json.dumps({
                          "ref": "main",
                          "inputs": {
                              "model": model,
                              "trigger_reason": reason,
                              "triggered_by": "drift-retraining-cronjob"
                          }
                      }).encode()
                      req = urllib.request.Request(
                          url,
                          data=payload,
                          headers={
                              "Authorization": f"Bearer {GITHUB_TOKEN}",
                              "Accept": "application/vnd.github+json",
                              "Content-Type": "application/json",
                              "X-GitHub-Api-Version": "2022-11-28",
                          },
                          method="POST"
                      )
                      try:
                          with urllib.request.urlopen(req, timeout=15) as resp:
                              print(f"[TRIGGER] {model}: retraining dispatched — {reason} (HTTP {resp.status})")
                      except Exception as e:
                          print(f"[ERROR] {model}: failed to dispatch retraining — {e}", file=sys.stderr)
                          sys.exit(1)

                  retrain_triggered = False

                  # --- BankChurn: PSI on key features + AUC degradation ---
                  bc_psi = query_prometheus('bankchurn_feature_psi_score')
                  bc_auc = query_prometheus('bankchurn_rolling_auc')
                  if bc_psi is not None and bc_psi > PSI_CRITICAL:
                      print(f"[DRIFT] BankChurn PSI={bc_psi:.3f} > {PSI_CRITICAL} — triggering retrain")
                      trigger_retraining("bankchurn", f"PSI={bc_psi:.3f} exceeds critical threshold {PSI_CRITICAL}")
                      retrain_triggered = True
                  elif bc_auc is not None and bc_auc < AUC_FLOOR:
                      print(f"[DRIFT] BankChurn AUC={bc_auc:.3f} < {AUC_FLOOR} — triggering retrain")
                      trigger_retraining("bankchurn", f"AUC={bc_auc:.3f} below floor {AUC_FLOOR}")
                      retrain_triggered = True
                  else:
                      print(f"[OK] BankChurn — PSI={bc_psi}, AUC={bc_auc}")

                  # --- CarVision: PSI + RMSE regression ---
                  cv_psi = query_prometheus('carvision_feature_psi_score')
                  cv_rmse = query_prometheus('carvision_rolling_rmse')
                  if cv_psi is not None and cv_psi > PSI_CRITICAL:
                      print(f"[DRIFT] CarVision PSI={cv_psi:.3f} > {PSI_CRITICAL} — triggering retrain")
                      trigger_retraining("carvision", f"PSI={cv_psi:.3f} exceeds critical threshold {PSI_CRITICAL}")
                      retrain_triggered = True
                  elif cv_rmse is not None and cv_rmse > RMSE_CEILING:
                      print(f"[DRIFT] CarVision RMSE=${cv_rmse:.0f} > ${RMSE_CEILING:.0f} — triggering retrain")
                      trigger_retraining("carvision", f"RMSE=${cv_rmse:.0f} exceeds ceiling ${RMSE_CEILING:.0f}")
                      retrain_triggered = True
                  else:
                      print(f"[OK] CarVision — PSI={cv_psi}, RMSE={cv_rmse}")

                  # --- NLPInsight: sentiment distribution shift + F1-macro ---
                  nlp_shift = query_prometheus(
                      'abs(rate(nlpinsight_predictions_total{sentiment="negative"}[7d]) / '
                      'rate(nlpinsight_predictions_total[7d]) - 0.125)'
                  )
                  nlp_f1 = query_prometheus('nlpinsight_rolling_f1_macro')
                  if nlp_shift is not None and nlp_shift > 0.25:
                      print(f"[DRIFT] NLPInsight sentiment shift={nlp_shift:.3f} > 0.25 — triggering retrain")
                      trigger_retraining("nlpinsight", f"Sentiment distribution shift={nlp_shift:.3f}")
                      retrain_triggered = True
                  elif nlp_f1 is not None and nlp_f1 < F1_FLOOR:
                      print(f"[DRIFT] NLPInsight F1={nlp_f1:.3f} < {F1_FLOOR} — triggering retrain")
                      trigger_retraining("nlpinsight", f"F1-macro={nlp_f1:.3f} below floor {F1_FLOOR}")
                      retrain_triggered = True
                  else:
                      print(f"[OK] NLPInsight — shift={nlp_shift}, F1={nlp_f1}")

                  if not retrain_triggered:
                      print("[PASS] All models within drift thresholds — no retraining triggered")

                  sys.exit(0)
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
