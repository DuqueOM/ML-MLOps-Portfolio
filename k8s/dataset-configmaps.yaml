# ConfigMaps for dataset download from GCS.
# Each project has its own ConfigMap pointing to the versioned dataset in GCS.
# Bucket: ml-portfolio-duque-om-202602-datasets-production
# Naming convention: {project}/v{version}/{filename}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bankchurn-dataset-config
  namespace: ml-portfolio
  labels:
    app: bankchurn-predictor
    component: dataset-download
data:
  GCS_BUCKET: "ml-portfolio-duque-om-202602-datasets-production"
  GCS_MODEL_PATH: "bankchurn/v1/Churn.csv"
  LOCAL_MODEL_PATH: "/data/raw/Churn.csv"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nlpinsight-dataset-config
  namespace: ml-portfolio
  labels:
    app: nlpinsight-analyzer
    component: dataset-download
data:
  GCS_BUCKET: "ml-portfolio-duque-om-202602-datasets-production"
  GCS_MODEL_PATH: "nlpinsight/v1/financial_phrasebank.csv"
  LOCAL_MODEL_PATH: "/data/raw/train.csv"
