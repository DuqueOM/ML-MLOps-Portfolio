# ConfigMaps for GCS model download paths.
# Separated from Deployments so model version updates are config-only operations.
# Usage: kubectl patch configmap bankchurn-model-config -n ml-portfolio \
#          -p '{"data":{"GCS_MODEL_PATH":"bankchurn/model-v2.joblib"}}'
#        kubectl rollout restart deployment/bankchurn-predictor -n ml-portfolio
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bankchurn-model-config
  namespace: ml-portfolio
  labels:
    app: bankchurn-predictor
    component: model-download
data:
  GCS_BUCKET: "ml-portfolio-duque-om-202602-ml-models-production"
  GCS_MODEL_PATH: "bankchurn/model.joblib"
  LOCAL_MODEL_PATH: "/models/model.joblib"
