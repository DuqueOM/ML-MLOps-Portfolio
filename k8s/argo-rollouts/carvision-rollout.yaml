# Argo Rollouts — Canary Deployment for CarVision
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: carvision-intelligence
  namespace: ml-portfolio
  labels:
    app: carvision-intelligence
    tier: ml-service
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: carvision-intelligence
  template:
    metadata:
      labels:
        app: carvision-intelligence
        tier: ml-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ml-workload
      containers:
      - name: carvision-api
        image: us-central1-docker.pkg.dev/ml-portfolio-duque-om-202602/ml-portfolio-images/carvision-market-intelligence:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: MODEL_PATH
          value: "/app/models/model.joblib"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            memory: "512Mi"
            cpu: "400m"
          limits:
            memory: "1Gi"
            cpu: "800m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
  strategy:
    canary:
      canaryService: carvision-canary
      stableService: carvision-stable
      trafficRouting:
        nginx:
          stableIngress: carvision-ingress
      steps:
      - setWeight: 20
      - pause: {duration: 60s}
      - analysis:
          templates:
          - templateName: canary-health-check
          args:
          - name: service-name
            value: carvision
      - setWeight: 50
      - pause: {duration: 120s}
      - analysis:
          templates:
          - templateName: canary-health-check
          args:
          - name: service-name
            value: carvision
      - setWeight: 100
      maxSurge: 1
      maxUnavailable: 0
---
apiVersion: v1
kind: Service
metadata:
  name: carvision-canary
  namespace: ml-portfolio
spec:
  selector:
    app: carvision-intelligence
  ports:
  - port: 80
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: carvision-stable
  namespace: ml-portfolio
spec:
  selector:
    app: carvision-intelligence
  ports:
  - port: 80
    targetPort: 8000
