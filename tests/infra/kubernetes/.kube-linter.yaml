checks:
  addAllBuiltIn: true
  exclude:
    # Init containers don't need probes (they run to completion)
    - "no-liveness-probe"
    - "no-readiness-probe"
    # We use emptyDir for model downloads (init container pattern)
    - "no-read-only-root-fs"
    # Prometheus needs cluster-wide access
    - "access-to-secrets"
    # Our ML services run as root inside containers (base python images)
    # TODO: migrate to non-root images
    - "run-as-non-root"
    # Grafana dashboard configmap is large by design
    - "dangling-service"
    # Portfolio project: single-replica is cost-effective; HPA handles scaling
    - "minimum-three-replicas"
    # CI/CD manages image tags; :latest is used for rolling deploys
    - "latest-tag"
    # DNS config not required for standard K8s DNS resolution
    - "dnsconfig-options"
    # Annotation/label requirements are org-specific, not needed for portfolio
    - "required-annotation-email"
    - "required-label-owner"
    # Network isolation via NetworkPolicy is handled at cluster level
    - "non-isolated-pod"
    # Node affinity optional for single-node-pool clusters
    - "no-node-affinity"
    # Init containers: resource limits optional for short-lived download tasks
    - "unset-cpu-requirements"
    - "unset-memory-requirements"
    # Wildcard service accounts acceptable for portfolio workloads
    - "wildcard-in-rules"
    - "sensitive-host-mounts"
